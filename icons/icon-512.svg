<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">HadirGuru</title>
  <desc id="desc">Bingkai QR dengan tanda centang verifikasi untuk absensi guru</desc>
  <defs>
    <linearGradient id="checkGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69D66F"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="#2563EB"/>

  <!-- Bingkai QR minimal dengan margin aman -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 64V48c0-3 2-5 5-5h16"/>
    <path d="M128 43h16c3 0 5 2 5 5v16"/>
    <path d="M43 128v16c0 3 2 5 5 5h16"/>
    <path d="M149 128v16c0 3-2 5-5 5h-16"/>
  </g>

  <!-- Badge hijau seperti tanda berhasil -->
  <rect x="67" y="67" width="58" height="58" rx="17" fill="url(#checkGreen)" stroke="#0F8F2F" stroke-width="2"/>
  <path d="M79 95l13 13 25-29" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
