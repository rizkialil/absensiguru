<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">HadirGuru</title>
  <desc id="desc">Siluet guru dengan QR Code untuk absensi</desc>
  <rect width="192" height="192" rx="44" fill="#2563EB"/>

  <!-- Foreground diperkecil agar aman dari crop launcher Android -->
  <g transform="translate(21.12 21.12) scale(0.78)">
    <!-- Siluet guru mengikuti bentuk referensi: kepala bulat dan badan membulat -->
    <g fill="#FFFFFF">
      <circle cx="55" cy="73" r="24"/>
      <path d="M18 145c2-24 16-40 36-40s34 16 36 40c1 8-5 15-14 15H32c-9 0-15-7-14-15Z"/>
    </g>

  <!-- Sudut pemindai mengelilingi QR Code -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 43V31h12M160 31h12v12M112 91v12h12M160 103h12V91"/>
  </g>

  <!-- QR Code sederhana agar tetap terbaca pada ukuran icon kecil -->
    <g fill="#FFFFFF">
      <path d="M120 46h14v14h-14zM124 50h6v6h-6z" fill-rule="evenodd"/>
      <path d="M144 46h14v14h-14zM148 50h6v6h-6z" fill-rule="evenodd"/>
      <path d="M120 70h14v14h-14zM124 74h6v6h-6z" fill-rule="evenodd"/>
      <path d="M140 65h6v6h-6zM150 65h8v6h-8zM140 75h6v9h-6zM150 75h8v9h-8z"/>
    </g>
  </g>
</svg>
