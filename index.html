  <!-- Early Theme Init (No White Flash) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('rz_theme') || 'light';
        const isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

    }

      will-change: transform, box-shadow;

    /* Laser Scanner Beam */
    @keyframes scanBeam {
      0%, 100% { top: 12%; opacity: 0.85; }
      50% { top: 86%; opacity: 0.85; }
    }

    @keyframes loginSpinner {
      to { transform: rotate(360deg); }
    }

    .login-spinner {
      display: inline-block;
      flex: 0 0 auto;
      width: 1rem;
      height: 1rem;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 9999px;
      transform-origin: center;
      will-change: transform;
      animation: loginSpinner 0.72s linear infinite;
    }
    .scanner-beam {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #2563EB, #A29BFE, #2563EB, transparent);
      box-shadow: 0 0 14px 2px #2563EB;
      animation: scanBeam 2.2s ease-in-out infinite;

    /* Modal Close & Cancel Buttons Feedback */
    button[onclick*="closeModal"] {

    }
    button[onclick*="closeModal"]:hover {
      transform: translateY(-1px);
    }

    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      /* Spinner adalah indikator proses, tetap bergerak agar login tidak
         terlihat membeku meskipun sistem mengaktifkan reduced motion. */
      .login-spinner {
        animation-duration: 0.72s !important;
        animation-iteration-count: infinite !important;
        animation-play-state: running !important;
      }
    }

    /* Print Styles for ID Cards & Reports */
    @media screen {
      #print-area {
        display: none !important;
        visibility: hidden !important;
        position: fixed !important;
        left: -9999px !important;
        top: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;

    /* Emil Kowalski Refined Motion Curves */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: scale(0.98) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 200ms var(--ease-out) forwards;
    }

    /* Modal Scale-in & Backdrop Entrance */
    @keyframes modalEnter {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes backdropFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-enter {
      animation: modalEnter 220ms var(--ease-out) forwards;
    }
    .backdrop-enter {
      animation: backdropFadeIn 180ms ease-out forwards;
    }

    /* Sonner-Style Toast Notifications */
    @keyframes toastEnter {
      from { opacity: 0; transform: scale(0.94) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes toastExit {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to { opacity: 0; transform: scale(0.94) translateY(-8px); }
    }
    .toast-enter {
      animation: toastEnter 240ms var(--ease-out) forwards;
    }
    .toast-exit {
      animation: toastExit 160ms ease-out forwards;

      to { opacity: 1; transform: scale(1) translateY(0); }

      const now = new Date();

        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      const parts = formatter.formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });

      const dateStr = `${map.year}-${map.month}-${map.day}`;
      const realHH = map.hour === '24' ? '00' : map.hour;
      const realMM = map.minute;
      const realSS = map.second;

      let activeHH = realHH;
      let activeMM = realMM;
      if (simulatedTimeHHMM) {
        const [sh, sm] = simulatedTimeHHMM.split(':');
        activeHH = sh;
        activeMM = sm;

      // Hitung hari dalam minggu berdasarkan tanggal Jakarta

      const dayIndex = localDateObj.getUTCDay();
      // Koreksi ke WIB (+7)
      const wibDayIndex = new Date(localDateObj.getTime() + 7 * 3600 * 1000).getUTCDay();
      const hari = HARI_LIST[wibDayIndex];

      return {

        isoTimestamp: localDateObj.toISOString(),
        isSimulated: Boolean(simulatedTimeHHMM)
      };

      const clamped = Math.max(0, Math.min(23 * 60 + 59, totalMins));
      const h = String(Math.floor(clamped / 60)).padStart(2, '0');
      const m = String(clamped % 60).padStart(2, '0');
      return `${h}:${m}`;

              Install Sekarang
            </button>
          </div>
        </div>
      `);

        try {

          console.warn('Install prompt tidak dapat ditampilkan:', err);

      };

          settings: state.settings,

        if (IS_PREVIEW || !state.adminUser) return;
        for (const teacher of state.teachers || []) {
          await setDoc(
            doc(fbDb, 'public_teachers', teacher.id),
            toPublicTeacherData(teacher),
            { merge: true }
          );
        }
      },

      async setDocument(colName, docId, data) {
        if (IS_PREVIEW) {
          if (colName === 'attendance_settings') {
            state.settings = { ...data };
          } else {
            const arr = this._getStateArray(colName);
            const idx = arr.findIndex(x => x.id === docId);
            if (idx >= 0) arr[idx] = { id: docId, ...data };
            else arr.push({ id: docId, ...data });
          }
          await this.syncPreview();
          return docId;
        }
        await setDoc(doc(fbDb, colName, docId), data, { merge: true });
        if (colName === 'teachers') {
          const teacher = await this.getDocument('teachers', docId);
          if (teacher) {
            await setDoc(doc(fbDb, 'public_teachers', docId), toPublicTeacherData(teacher), { merge: true });
          }
        }
        await this.getAll();
        return docId;
      },

        if (IS_PREVIEW) {
          const newId = 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
          const arr = this._getStateArray(colName);
          arr.unshift({ id: newId, ...data });
          await this.syncPreview();
          return newId;
        }
        const ref = await addDoc(collection(fbDb, colName), data);
        if (colName === 'teachers') {
          await setDoc(doc(fbDb, 'public_teachers', ref.id), toPublicTeacherData({ id: ref.id, ...data }));
        }
        await this.getAll();
        return ref.id;
      },

      async deleteDocument(colName, docId) {
        if (IS_PREVIEW) {
          const arr = this._getStateArray(colName);
          const idx = arr.findIndex(x => x.id === docId);
          if (idx >= 0) arr.splice(idx, 1);
          await this.syncPreview();
          return;
        }
        await deleteDoc(doc(fbDb, colName, docId));
        if (colName === 'teachers') {
          await deleteDoc(doc(fbDb, 'public_teachers', docId));
        }
        await this.getAll();
      },

      _getStateArray(colName) {
        const map = {
          school_years: state.schoolYears,
          subjects: state.subjects,
          classes: state.classes,
          teachers: state.teachers,
          qr_tokens: state.qrTokens,
          teaching_schedules: state.schedules,
          attendance_records: state.attendanceRecords,
          audit_logs: state.auditLogs
        };
        return map[colName];
      }
    };

    function getTodaySchedulesForTeacher(teacherId, hariName, kategori = null) {
      const activeYear = state.schoolYears.find(y => y.is_active);
      return state.schedules.filter(s => {
        const matchTeacher = s.teacher_id === teacherId;
        const matchDay = s.hari === hariName;
        const matchYear = activeYear ? s.school_year_id === activeYear.id : true;
        const matchKat = !kategori || kategori === 'all' || s.kategori === kategori;
        return matchTeacher && matchDay && matchYear && matchKat;
      }).sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));
    }

    function getFirstScheduleForTeacherOnDay(teacherId, hariName, kategori = null) {
      const list = getTodaySchedulesForTeacher(teacherId, hariName, kategori);
      return list.length > 0 ? list[0] : null;
    }

    /**
     * Evaluasi apakah guru yang belum absen pada jadwal tertentu sudah melewati batas akhir
     * untuk membedakan status "Belum Absen" vs "Tidak Hadir"
     */
    function evaluateMissingAttendanceStatus(schedule, targetDateStr) {
      const jakarta = getJakartaNow();
      const cfg = state.settings || getDefaultSettings();
      const startMins = timeToMinutes(schedule.jam_mulai);
      const deadlineMins = startMins + Number(cfg.batas_akhir_menit_setelah_jadwal || 45);

      if (targetDateStr < jakarta.dateStr) {
        return 'Tidak Hadir';
      }
      if (targetDateStr > jakarta.dateStr) {
        return 'Belum Absen';
      }
      const nowMins = timeToMinutes(jakarta.timeHHMM);
      return nowMins > deadlineMins ? 'Tidak Hadir' : 'Belum Absen';
    }

    function getGeofenceSettings(cfg = null) {
      const source = cfg || state.settings || getDefaultSettings();
      const latitudeRaw = String(source.geofence_latitude ?? '').trim();
      const longitudeRaw = String(source.geofence_longitude ?? '').trim();
      const radiusRaw = String(source.geofence_radius_meters ?? '').trim();
      const latitude = latitudeRaw === '' ? NaN : Number(latitudeRaw);
      const longitude = longitudeRaw === '' ? NaN : Number(longitudeRaw);
      const radius = radiusRaw === '' ? NaN : Number(radiusRaw);
      return {
        enabled: source.geofence_enabled === true,
        latitude,
        longitude,
        radius: Number.isFinite(radius) ? Math.min(500, Math.max(10, radius)) : 100
      };
    }

    function isValidCoordinate(latitude, longitude) {
      return Number.isFinite(latitude) && Number.isFinite(longitude)
        && latitude >= -90 && latitude <= 90
        && longitude >= -180 && longitude <= 180;
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const earthRadius = 6371000;
      const toRadians = value => value * Math.PI / 180;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * Math.sin(dLon / 2) ** 2;
      return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function requestCurrentDevicePosition() {
      if (!navigator.geolocation) {
        throw new Error('Perangkat atau browser ini tidak mendukung GPS.');
      }

      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          resolve,
          error => {
            const messages = {
              1: 'Izin lokasi ditolak. Izinkan akses lokasi untuk melakukan absensi.',
              2: 'Lokasi perangkat tidak dapat ditemukan. Pastikan GPS/lokasi perangkat aktif.',
              3: 'Pengambilan lokasi terlalu lama. Coba aktifkan GPS lalu ulangi.'
            };
            reject(new Error(messages[error.code] || 'Lokasi perangkat tidak dapat dibaca.'));
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      });
    }

    async function validateAttendanceLocation(cfg = null) {
      const settings = getGeofenceSettings(cfg);
      if (!settings.enabled) {
        return { enabled: false, checked: false, latitude: null, longitude: null, accuracyMeters: null };
      }

      if (!isValidCoordinate(settings.latitude, settings.longitude)) {
        throw new Error('Lokasi kantor sekolah belum diatur oleh Admin. Absensi belum dapat dilakukan.');
      }

      const position = await requestCurrentDevicePosition();
      const latitude = Number(position.coords.latitude);
      const longitude = Number(position.coords.longitude);
      const accuracy = Number(position.coords.accuracy);

      if (!isValidCoordinate(latitude, longitude) || !Number.isFinite(accuracy)) {
        throw new Error('Data lokasi perangkat tidak valid. Silakan ulangi di area kantor sekolah.');
      }

      // Akurasi yang terlalu rendah membuat hasil geofence tidak dapat dipercaya.
      if (accuracy > 150) {
        throw new Error(`Akurasi GPS terlalu rendah (±${Math.round(accuracy)} m). Aktifkan GPS akurasi tinggi lalu coba lagi.`);
      }

      const distance = calculateDistanceMeters(
        settings.latitude,
        settings.longitude,
        latitude,
        longitude
      );

      if (distance > settings.radius) {
        throw new Error(`Anda berada di luar area absensi kantor sekolah (jarak terdeteksi ±${Math.round(distance)} m).`);
      }

      return {
        enabled: true,
        checked: true,
        latitude,
        longitude,
        distanceMeters: Math.round(distance),
        accuracyMeters: Math.round(accuracy)
      };
    }

    /**
     * Proses Inti Presensi Guru 1x Sehari (Opsi 1):
     * Guru cukup scan/input 1x saat datang. Jam kedatangan divalidasi terhadap jadwal pertama guru hari itu.
     * Sekali presensi berhasil, SELURUH jadwal mengajar KBM guru pada hari tersebut otomatis tercatat Hadir.
     */
    async function processTeacherAttendance({ teacherId, qrToken = null, metode = 'MANUAL' }) {
      if (!rateLimiter.check(15, 30000)) {
        throw new Error('Terlalu banyak percobaan dalam waktu singkat. Silakan tunggu beberapa detik.');
      }

      const jakarta = getJakartaNow();
      const cfg = { ...getDefaultSettings(), ...(state.settings || {}) };

      // QR dan absensi manual wajib melewati pemeriksaan lokasi yang sama.
      const locationCheck = await validateAttendanceLocation(cfg);

      // 1. Cek Hari Kerja
      if (!cfg.hari_kerja.includes(jakarta.hari)) {
        throw new Error(`Hari ${jakarta.hari} bukan merupakan hari kerja aktif pada konfigurasi sekolah.`);
      }

      // 2. Jika QR_CODE, validasi token terlebih dahulu
      let resolvedTeacherId = teacherId;
      if (metode === 'QR_CODE') {
        const cleanToken = String(qrToken || '').trim();
        let tokenObj = state.qrTokens.find(t => t.token === cleanToken || t.id === cleanToken);
        // Pada halaman publik, ambil hanya token yang dipindai (bukan seluruh koleksi QR).
        if (!tokenObj) {
          tokenObj = await dbAdapter.getDocument('qr_tokens', cleanToken);
        }
        if (!tokenObj) {
          throw new Error('QR Code tidak dikenali oleh sistem. Pastikan Anda memindai kartu QR resmi.');
        }
        if (!tokenObj.is_active) {
          throw new Error('Token QR Code ini telah dinonaktifkan oleh Admin. Hubungi tata usaha/admin.');
        }
        resolvedTeacherId = tokenObj.teacher_id;
      }

      // 3. Validasi Identitas & Status Aktif Guru
      const teacher = state.teachers.find(t => t.id === resolvedTeacherId);
      if (!teacher) {
        throw new Error('Data guru tidak ditemukan di dalam sistem.');
      }
      if (teacher.status !== 'aktif') {
        throw new Error(`Akun kepegawaian ${teacher.nama_lengkap} berstatus NONAKTIF. Silakan hubungi Admin.`);
      }

      // 4. Cari Semua Jadwal Mengajar KBM Guru pada Hari Ini
      const allTodaySchedules = getTodaySchedulesForTeacher(teacher.id, jakarta.hari).filter(s => !s.kategori || s.kategori === 'KBM_REGULER');
      if (allTodaySchedules.length === 0) {
        throw new Error(`Tidak ditemukan jadwal mengajar KBM untuk ${teacher.nama_lengkap} pada hari ${jakarta.hari}.`);
      }

      // 5. Cek Apakah Guru Sudah Pernah Presensi Hari Ini (Opsi 1: Cukup 1x Sehari)
      const todayExistingRecords = [];
      for (const sch of allTodaySchedules) {
        const recordId = `${teacher.id}_${sch.id}_${jakarta.dateStr}`;
        // Detail riwayat tidak dibuka untuk terminal publik. Duplikasi tetap
        // dicegah secara atomik oleh Firestore rules saat transaksi menyimpan.
        const existingRecord = (IS_PREVIEW || state.adminUser)
          ? await dbAdapter.getDocument('attendance_records', recordId)
          : null;
        if (existingRecord && (!existingRecord.kategori || existingRecord.kategori === 'KBM_REGULER')) {
          todayExistingRecords.push(existingRecord);
        }
      }
      if (todayExistingRecords.length > 0) {
        const firstRec = todayExistingRecords[0];
        throw new Error(
          `${teacher.nama_lengkap} sudah tercatat presensi KBM hari ini pada pukul ${firstRec.waktu_absensi} WIB (${firstRec.status}). Seluruh (${todayExistingRecords.length}) jadwal mengajar Anda hari ini sudah tersimpan.`
        );
      }

      // 6. Evaluasi Waktu Absensi Berdasarkan Jadwal KBM Pertama Guru Hari Ini
      const firstSchedule = allTodaySchedules[0];
      const schedStartMins = timeToMinutes(firstSchedule.jam_mulai);
      const openMins = schedStartMins - Number(cfg.menit_buka_sebelum_jadwal || 15);
      const toleranceMins = Number(cfg.toleransi_terlambat_menit || 15);
      const modeToleransi = cfg.mode_toleransi || 'DISPENSASI_HADIR'; // 'DISPENSASI_HADIR' | 'KETAT_TERLAMBAT'

      // Rentang jam masuk s.d. (jadwal pertama + toleransi)
      const onTimeDeadlineMins = modeToleransi === 'DISPENSASI_HADIR'
        ? (schedStartMins + toleranceMins)
        : schedStartMins;
      const lateDeadlineMins = schedStartMins + Number(cfg.batas_akhir_menit_setelah_jadwal || 45);
      const nowMins = timeToMinutes(jakarta.timeHHMM);

      if (nowMins < openMins) {
        throw new Error(
          `Presensi untuk ${teacher.nama_lengkap} belum dibuka. Jadwal mengajar pertama Anda hari ini (Jam ${formatJamKeDisplay(firstSchedule.jam_ke, firstSchedule.jam_ke_selesai)}) dimulai pukul ${firstSchedule.jam_mulai} WIB (Presensi dibuka mulai ${minutesToTime(openMins)} WIB).`
        );
      }

      let finalStatus = 'Hadir';
      let menitTerlambat = 0;
      let isDispensasi = false;

      if (nowMins <= onTimeDeadlineMins) {
        finalStatus = 'Hadir';
        menitTerlambat = 0;
        if (nowMins > schedStartMins) {
          isDispensasi = true;
        }
      } else if (nowMins <= lateDeadlineMins) {
        finalStatus = 'Terlambat';
        menitTerlambat = nowMins - schedStartMins;
      } else {
        if (cfg.kebijakan_lewat_batas === 'TIDAK_HADIR') {
          finalStatus = 'Tidak Hadir';
          menitTerlambat = nowMins - schedStartMins;
        } else {
          throw new Error(
            `Batas waktu presensi untuk jadwal pertama Anda (${firstSchedule.jam_mulai} WIB) telah berakhir pada pukul ${minutesToTime(lateDeadlineMins)} WIB. Silakan hubungi Admin / Guru Piket.`
          );
        }
      }

      // 7. Simpan Presensi untuk SELURUH Jadwal Mengajar KBM Guru Hari Ini (Opsi 1)
      const recordPayloads = [];
      for (const sch of allTodaySchedules) {
        const sub = state.subjects.find(s => s.id === sch.subject_id);
        const cls = state.classes.find(c => c.id === sch.class_id);
        const taskTitle = sch.nama_tugas || (sub ? sub.nama_mapel : 'KBM');
        const lokasi = sch.lokasi || (cls ? cls.nama_kelas : '-');
        const uniqueRecordId = `${teacher.id}_${sch.id}_${jakarta.dateStr}`;

        const payload = {
          id: uniqueRecordId,
          teacher_id: teacher.id,
          schedule_id: sch.id,
          kategori: 'KBM_REGULER',
          nama_tugas: taskTitle,
          lokasi,
          tanggal: jakarta.dateStr,
          hari: jakarta.hari,
          jadwal_jam_mulai: sch.jam_mulai,
          jadwal_jam_selesai: sch.jam_selesai,
          subject_id: sch.subject_id || '',
          class_id: sch.class_id || '',
          waktu_absensi: jakarta.timeFull,
          status: finalStatus,
          menit_terlambat: menitTerlambat,
          is_dispensasi: isDispensasi,
          metode: metode,
          device_info: getDeviceSummary(),
          geofence_checked: locationCheck.checked,
          geofence_distance_meters: locationCheck.distanceMeters ?? null,
          geofence_accuracy_meters: locationCheck.accuracyMeters ?? null,
          catatan_koreksi: finalStatus === 'Tidak Hadir'
            ? 'Otomatis ditandai Tidak Hadir (melewati batas waktu absensi)'
            : (isDispensasi ? `Hadir dalam masa toleransi dispensasi (+${nowMins - schedStartMins} mnt)` : '')
        };
        recordPayloads.push(payload);
      }

      if (IS_PREVIEW) {
        for (const rec of recordPayloads) {
          state.attendanceRecords.unshift(rec);
        }
        await dbAdapter.syncPreview();
      } else {
        await runTransaction(fbDb, async (transaction) => {
          for (const rec of recordPayloads) {
            const recRef = doc(fbDb, 'attendance_records', rec.id);
            transaction.set(recRef, rec);
          }
        });
        await dbAdapter.getAll();
      }

      return {
        teacher,
        schedules: allTodaySchedules,
        scheduleCount: allTodaySchedules.length,
        firstSchedule,
        tanggal: jakarta.formattedDate,
        waktu: jakarta.timeFull,
        status: finalStatus,
        menit_terlambat: menitTerlambat,
        isDispensasi,
        metode: metode === 'QR_CODE' ? 'QR Code' : 'Absensi Manual'
      };
    }

    function getAppTheme() {
      return localStorage.getItem('rz_theme') || (state?.settings?.app_theme || 'light');
    }

    function setAppTheme(theme) {
      localStorage.setItem('rz_theme', theme);
      if (state && state.settings) {
        state.settings.app_theme = theme;
      }
      const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeButtons();
    }

    function toggleAppTheme() {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      const nextTheme = isCurrentlyDark ? 'light' : 'dark';
      setAppTheme(nextTheme);
      showToast(nextTheme === 'dark' ? 'Mode Gelap diaktifkan' : 'Mode Terang diaktifkan', 'info');
    }

    function updateThemeButtons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.querySelectorAll('.btn-theme-toggle').forEach(btn => {
        btn.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="w-4 h-4 ${isDark ? 'text-amber-400' : 'text-[#2563EB]'}"></i>`;
        btn.title = isDark ? 'Beralih ke Mode Terang' : 'Beralih ke Mode Gelap';
      });
      if (window.lucide) lucide.createIcons();
    }

    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getAppTheme() === 'auto') {
          setAppTheme('auto');
        }
      });
    } catch (e) {}

    window.toggleAppTheme = toggleAppTheme;
    window.setAppTheme = setAppTheme;
    window.getAppTheme = getAppTheme;

    // =========================================================================

    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast_' + Date.now() + Math.random().toString(36).slice(2, 5);

      const styles = {
        success: 'bg-white border-emerald-200 text-[#0F172A]',
        error: 'bg-white border-rose-200 text-[#0F172A]',
        warning: 'bg-white border-amber-200 text-[#0F172A]',
        info: 'bg-white border-[#2563EB]/30 text-[#0F172A]'
      };
      const iconBg = {
        success: 'bg-emerald-100 text-emerald-600',
        error: 'bg-rose-100 text-rose-600',
        warning: 'bg-amber-100 text-amber-600',
        info: 'bg-[#E2E8F0] text-[#2563EB]'
      };
      const iconName = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info'
      };

      const dismissToast = () => {
        const target = document.getElementById(id);
        if (target && !target.dataset.closing) {
          target.dataset.closing = 'true';
          target.classList.remove('toast-enter');
          target.classList.add('toast-exit');
          setTimeout(() => target.remove(), 160);
        }
      };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border shadow-xl toast-enter ${styles[type] || styles.info}`;
      el.innerHTML = `
        <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${iconBg[type] || iconBg.info}">
          <i data-lucide="${iconName[type] || 'info'}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 text-xs font-medium leading-relaxed pt-0.5">${escapeHtml(message)}</div>
        <button id="btn-toast-close-${id}" class="text-[#94A3B8] hover:text-[#0F172A] p-1">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      `;
      container.appendChild(el);
      document.getElementById(`btn-toast-close-${id}`)?.addEventListener('click', dismissToast);
      if (window.lucide) lucide.createIcons();

      setTimeout(dismissToast, 4000);
    }

    function openModal(htmlContent, maxWidthClass = 'max-w-xl') {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.className = `bg-white rounded-3xl shadow-2xl border border-[#E2E8F0] w-full ${maxWidthClass} max-h-[90vh] overflow-y-auto modal-enter relative`;
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex', 'backdrop-enter');
      // Modal hanya bisa ditutup via icon silang (x) atau tombol Batal/Tutup, klik di luar (backdrop) dinonaktifkan
      backdrop.onclick = null;

      // Event listener langsung pada tombol tutup (x) & batal di dalam modal untuk keamanan maksimal
      box.querySelectorAll('[onclick*="closeModal"], [data-modal-close]').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          closeModal();
        };
      });

      if (window.lucide) lucide.createIcons();
      initCustomSelects(box);
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (box) {
        box.style.transition = 'transform 160ms var(--ease-out), opacity 160ms ease-out';
        box.style.transform = 'scale(0.96) translateY(6px)';
        box.style.opacity = '0';
      }
      setTimeout(() => {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex', 'backdrop-enter');
        if (box) {
          box.style.transform = '';
          box.style.opacity = '';
        }
      }, 160);

    window.openModal = openModal;

    window.addEventListener('keydown', (e) => {

    // Audio Chime Synthesizer via Web Audio API (Zero External Assets)
    function playAudioChime(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;
        if (type === 'success') {
          // Melodious two-tone ascending chime (D5 -> A5)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now); // D5
          gain1.gain.setValueAtTime(0.12, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.12); // A5
          gain2.gain.setValueAtTime(0.16, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.12);
          osc2.stop(now + 0.55);
        } else if (type === 'warning') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now); // A4
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now); // A3
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        // Fallback silently if audio context is unavailable
      }
    }

    // =========================================================================
    // MODERN CUSTOM SELECT DROPDOWN COMPONENT (TAILWIND UI)
    // =========================================================================
    function initCustomSelects(root = document) {
      if (!root) return;
      const selects = root.querySelectorAll('select:not([data-no-custom])');
      selects.forEach(selectEl => enhanceSelect(selectEl));
      initCustomSelectGlobalEvents();
    }
    window.initCustomSelects = initCustomSelects;

    function initCustomSelectGlobalEvents() {
      if (window._customSelectGlobalEventsAttached) return;
      window._customSelectGlobalEventsAttached = true;

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.custom-select-wrapper')) {
          closeAllCustomSelects();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeAllCustomSelects();
        }
      });
    }

    function closeAllCustomSelects() {
      document.querySelectorAll('.custom-select-menu:not(.hidden)').forEach(m => {
        m.classList.add('hidden');
        const wr = m.closest('.custom-select-wrapper');
        if (wr) wr.style.zIndex = '';
        wr?.querySelector('.custom-select-arrow')?.classList.remove('rotate-180');
      });
    }

    function enhanceSelect(selectEl) {
      if (!selectEl || selectEl.dataset.noCustom === 'true') return;

      // Jika sudah di-enhance, cukup sinkronkan state dan labelnya
      if (selectEl.dataset.customSelect === 'true') {
        if (typeof selectEl._syncCustomSelect === 'function') {
          selectEl._syncCustomSelect();
        }
        return;
      }

      const parent = selectEl.parentNode;
      if (!parent) return;

      const isFullWidth = selectEl.classList.contains('w-full') || selectEl.style.width === '100%';
      const isSlotSelect = selectEl.id.startsWith('sch-jamke') || selectEl.dataset.slotSelect === 'true';
      const isCompact = selectEl.classList.contains('py-1.5') || selectEl.classList.contains('py-2') || selectEl.classList.contains('px-2') || selectEl.classList.contains('px-2.5') || selectEl.classList.contains('rounded-lg') || isSlotSelect;
      const isF8Bg = selectEl.classList.contains('bg-[#F8FAFC]');

      // Buat container wrapper
      const wrapper = document.createElement('div');
      wrapper.className = `custom-select-wrapper relative ${isFullWidth ? 'w-full' : 'inline-block'}`;

      // Sisipkan wrapper menggantikan posisi select
      parent.insertBefore(wrapper, selectEl);
      wrapper.appendChild(selectEl);

      // Sembunyikan elemen select asli secara aksesibel agar form submit & validasi tetap berjalan
      selectEl.style.cssText = 'position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; opacity: 0 !important; pointer-events: none !important;';
      selectEl.tabIndex = -1;
      selectEl.setAttribute('aria-hidden', 'true');

      // Buat tombol pemicu (trigger) dengan styling yang serasi dengan form input
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = isSlotSelect
        ? `custom-select-trigger w-full flex items-center justify-between gap-1.5 px-2.5 py-2 rounded-xl bg-white border border-[#CBD5E1] hover:border-[#2563EB] text-xs font-bold text-[#0F172A] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 transition cursor-pointer text-left`
        : (isCompact
          ? `custom-select-trigger w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-white border border-[#CBD5E1] hover:border-[#2563EB] text-xs font-semibold text-[#0F172A] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 transition cursor-pointer text-left`
          : `custom-select-trigger w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl ${isF8Bg ? 'bg-[#F8FAFC]' : 'bg-white'} border border-[#E2E8F0] hover:border-[#CBD5E1] text-xs font-bold text-[#0F172A] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/25 transition cursor-pointer text-left shadow-2xs`);

      trigger.innerHTML = `
        <span class="custom-select-label truncate flex-1"></span>
        <i data-lucide="chevron-down" class="custom-select-arrow w-4 h-4 text-[#64748B] shrink-0 transition-transform duration-200"></i>
      `;

      // Buat menu pop-up terapung
      const menu = document.createElement('div');
      menu.className = isSlotSelect
        ? `custom-select-menu absolute z-50 left-0 mt-1.5 min-w-[130px] w-full max-w-[180px] bg-white rounded-2xl border border-[#CBD5E1] shadow-2xl p-1.5 space-y-0.5 hidden max-h-48 overflow-y-auto`
        : `custom-select-menu absolute z-50 left-0 right-0 mt-1.5 min-w-[140px] bg-white rounded-2xl border border-[#E2E8F0] shadow-xl p-1.5 space-y-0.5 hidden max-h-60 overflow-y-auto`;

      wrapper.appendChild(trigger);
      wrapper.appendChild(menu);

      function syncCustomSelect() {
        trigger.disabled = selectEl.disabled;
        if (selectEl.disabled) {
          trigger.classList.add('opacity-60', 'cursor-not-allowed', 'bg-slate-100');
        } else {
          trigger.classList.remove('opacity-60', 'cursor-not-allowed', 'bg-slate-100');
        }

        const curVal = selectEl.value;
        let selectedOption = null;
        for (let i = 0; i < selectEl.options.length; i++) {
          if (selectEl.options[i].value === curVal || (!curVal && i === selectEl.selectedIndex)) {
            selectedOption = selectEl.options[i];
            break;
          }
        }
        if (!selectedOption && selectEl.options.length > 0) {
          selectedOption = selectEl.options[selectEl.selectedIndex >= 0 ? selectEl.selectedIndex : 0];
        }

        const labelSpan = trigger.querySelector('.custom-select-label');
        if (labelSpan) {
          let labelText = selectedOption ? selectedOption.text : 'Pilih...';
          if (isSlotSelect) {
            // Ubah "Jam ke-1 (07:30)" menjadi "Jam ke-1" agar pas dan tidak terpotong di tombol sempit
            labelText = labelText.replace(/\s*\([^)]*\)$/, '');
          }
          labelSpan.textContent = labelText;
        }

        // Render ulang opsi di dalam menu
        menu.innerHTML = '';
        if (selectEl.options.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'px-3 py-2 text-xs text-[#94A3B8] font-medium text-center';
          empty.textContent = 'Tidak ada pilihan';
          menu.appendChild(empty);
        } else {
          Array.from(selectEl.options).forEach((opt) => {
            const isSelected = opt.value === selectEl.value;
            const optBtn = document.createElement('button');
            optBtn.type = 'button';
            optBtn.dataset.value = opt.value;
            optBtn.className = `custom-select-option w-full text-left px-3 py-2 rounded-xl text-xs transition flex items-center justify-between cursor-pointer ${
              isSelected
                ? 'bg-[#EFF6FF] text-[#2563EB] font-bold'
                : 'text-[#334155] font-semibold hover:bg-[#F8FAFC] hover:text-[#0F172A]'
            }`;
            const optDisplay = isSlotSelect ? opt.text.replace(/\s*\([^)]*\)$/, '') : opt.text;
            optBtn.innerHTML = `
              <span class="${isSlotSelect ? 'whitespace-nowrap pr-2' : 'truncate'}">${escapeHtml(optDisplay)}</span>
              ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-[#2563EB] shrink-0 ml-2"></i>' : ''}
            `;

            optBtn.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              const oldVal = selectEl.value;
              selectEl.value = opt.value;
              closeMenu();
              syncCustomSelect();
              if (oldVal !== opt.value) {
                selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                selectEl.dispatchEvent(new Event('input', { bubbles: true }));
                if (typeof selectEl.onchange === 'function') {
                  selectEl.onchange({ target: selectEl });
                }
              }
            };
            menu.appendChild(optBtn);
          });
        }

        if (window.lucide) {
          lucide.createIcons({ root: wrapper });
        }
      }

      function openMenu() {
        if (selectEl.disabled) return;
        closeAllCustomSelects();

        syncCustomSelect();

        // Cek ruang vertikal (jika di bawah sempit, buka ke atas)
        const rect = trigger.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom;
        const spaceAbove = rect.top;
        if (spaceBelow < 210 && spaceAbove > 210) {
          menu.classList.remove('mt-1.5', 'top-full');
          menu.classList.add('mb-1.5', 'bottom-full');
        } else {
          menu.classList.remove('mb-1.5', 'bottom-full');
          menu.classList.add('mt-1.5', 'top-full');
        }

        // Cek posisi horizontal agar tidak terpotong tepi kanan layar
        if (rect.left + 230 > window.innerWidth) {
          menu.classList.remove('left-0');
          menu.classList.add('right-0');
        } else {
          menu.classList.remove('right-0');
          menu.classList.add('left-0');
        }

        wrapper.style.zIndex = '60';
        menu.classList.remove('hidden');
        const arrow = trigger.querySelector('.custom-select-arrow');
        if (arrow) arrow.classList.add('rotate-180');
      }

      function closeMenu() {
        menu.classList.add('hidden');
        wrapper.style.zIndex = '';
        const arrow = trigger.querySelector('.custom-select-arrow');
        if (arrow) arrow.classList.remove('rotate-180');
      }

      trigger.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (menu.classList.contains('hidden')) {
          openMenu();
        } else {
          closeMenu();
        }
      };

      // Listener perubahan event change native
      selectEl.addEventListener('change', syncCustomSelect);

      // MutationObserver untuk mendeteksi perubahan innerHTML / opsi secara dinamis
      const observer = new MutationObserver(() => {
        syncCustomSelect();
      });
      observer.observe(selectEl, { childList: true, subtree: true, attributes: true });

      // Override setter .value agar penugasan langsung lewat JS (el.value = 'x') langsung memperbarui tampilan
      try {
        const protoDescriptor = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
        if (protoDescriptor && protoDescriptor.set) {
          Object.defineProperty(selectEl, 'value', {
            get() {
              return protoDescriptor.get.call(this);
            },
            set(v) {
              protoDescriptor.set.call(this, v);
              syncCustomSelect();
            },
            configurable: true
          });
        }
      } catch (e) {}

      if (selectEl.form) {
        selectEl.form.addEventListener('reset', () => {
          setTimeout(syncCustomSelect, 10);
        });
      }

      selectEl._customSelectWrapper = wrapper;
      selectEl._syncCustomSelect = syncCustomSelect;
      selectEl._openCustomSelect = openMenu;
      selectEl._closeCustomSelect = closeMenu;
      selectEl.dataset.customSelect = 'true';

      syncCustomSelect();
    }

    async function startQrCameraScanner() {
      const statusBanner = document.getElementById('qr-status-banner');
      try {
        await stopQrScannerIfRunning();
        if (!window.Html5Qrcode) {
          if (statusBanner) statusBanner.textContent = 'Library scanner belum siap. Gunakan input token di bawah.';
          return;
        }
        const html5Qr = new Html5Qrcode('qr-reader-viewport');
        state.html5QrInstance = html5Qr;

        await html5Qr.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (decodedText) => {
            await handleQrScannedSuccess(decodedText);
          },
          () => {}
        );

        if (statusBanner) {
          statusBanner.className = 'mt-3 p-3 rounded-xl bg-emerald-50 text-xs font-semibold text-emerald-700 text-center';
          statusBanner.textContent = 'Kamera aktif. Arahkan QR Code ke dalam kotak pemindai.';
        }
      } catch (err) {
        if (statusBanner) {
          statusBanner.className = 'mt-3 p-3 rounded-xl bg-amber-50 text-xs font-medium text-amber-700 text-center';
          statusBanner.textContent = 'Kamera tidak tersedia/diizinkan di perangkat ini. Gunakan kolom input token QR di bawah.';
        }
      }
    }

    let qrScanLock = false;
    async function handleQrScannedSuccess(tokenStr) {
      if (qrScanLock) return;
      qrScanLock = true;
      try {
        await stopQrScannerIfRunning();
        const result = await processTeacherAttendance({
          qrToken: tokenStr,
          metode: 'QR_CODE'
        });
        if (result) {
          showAttendanceResultCard(result);
        }
      } catch (err) {
        playAudioChime('error');
        showPublicAttendanceNotice({
          title: 'Absensi Gagal',
          message: err.message,
          type: 'error',
          onOk: () => navigateToApp('public', { publicMode: 'idle' })
        });
      } finally {
        setTimeout(() => { qrScanLock = false; }, 1200);
      }
    }

    function showAttendanceResultCard(result) {
      clearPublicCountdown();
      const cfg = state.settings || getDefaultSettings();
      state.publicResult = result;
      state.publicMode = 'result';
      state.publicCountdown = Number(cfg.jeda_reset_publik_detik || 8);
      updateAppHistory('public', { publicMode: 'result' });
      renderPublicBodyArea();

      const isLate = result.status === 'Terlambat';
      const isAbsent = result.status === 'Tidak Hadir';
      const isDispensasi = Boolean(result.isDispensasi);
      playAudioChime(isAbsent ? 'error' : (isLate || isDispensasi) ? 'warning' : 'success');
      const noticeType = isAbsent ? 'error' : isLate ? 'warning' : 'success';
      const count = result.scheduleCount || (result.schedules ? result.schedules.length : 1);
      const noticeMessage = isLate && result.menit_terlambat > 0
        ? `Presensi ${result.teacher.nama_lengkap} tercatat Terlambat (+${result.menit_terlambat} mnt). Seluruh (${count}) jadwal KBM hari ini tersimpan.`
        : isDispensasi
          ? `Presensi ${result.teacher.nama_lengkap} tercatat Hadir (Toleransi Dispensasi). Seluruh (${count}) jadwal KBM hari ini tersimpan.`
          : `Presensi ${result.teacher.nama_lengkap} berhasil (${result.status}). Seluruh (${count}) jadwal KBM hari ini tersimpan.`;
      showPublicAttendanceNotice({
        title: isAbsent ? 'Absensi Tidak Hadir' : isLate ? 'Absensi Terlambat' : 'Absensi Berhasil',
        message: noticeMessage,
        type: noticeType
      });

      state.publicCountdownTimer = setInterval(() => {
        state.publicCountdown -= 1;
        const numEl = document.getElementById('reset-countdown-num');
        if (numEl) numEl.textContent = state.publicCountdown;
        if (state.publicCountdown <= 0) {
          clearPublicCountdown();
          if (state.route === 'public') {

    // =========================================================================
    // 9A. ROUTING BERBASIS HASH (REFRESH & TOMBOL KEMBALI)
    // =========================================================================
    function normalizeAdminTab(tab) {
      const candidate = String(tab || 'dashboard');
      return ADMIN_MENUS.some(menu => menu.id === candidate) ? candidate : 'dashboard';
    }

    function normalizePublicMode(mode) {
      const candidate = String(mode || 'idle');
      return ['idle', 'qr', 'manual', 'result'].includes(candidate) ? candidate : 'idle';
    }

    function parseAppLocation() {
      const rawHash = decodeURIComponent(String(window.location.hash || '').replace(/^#/, ''));
      const [section, value] = rawHash.split('/');

      if (section === 'admin') {
        return { route: 'admin', adminTab: normalizeAdminTab(value) };
      }
      if (section === 'login') {
        return { route: 'login' };
      }
      if (section === 'public') {
        return { route: 'public', publicMode: normalizePublicMode(value) };
      }
      return { route: 'public', publicMode: 'idle' };
    }

    function getAppHash(route, { adminTab = state.adminTab, publicMode = state.publicMode } = {}) {
      if (route === 'admin') return `#admin/${normalizeAdminTab(adminTab)}`;
      if (route === 'login') return '#login';
      return publicMode && publicMode !== 'idle' ? `#public/${normalizePublicMode(publicMode)}` : '#public';
    }

    function updateAppHistory(route, options = {}) {
      const hash = getAppHash(route, options);
      if (window.location.hash === hash) return;
      const method = options.replace ? 'replaceState' : 'pushState';
      window.history[method]({ appRoute: hash }, '', hash);
    }

    function renderAuthLoadingScreen() {
      const root = document.getElementById('app-root');
      if (!root) return;
      root.innerHTML = `
        <div class="min-h-screen w-full bg-[#F8FAFC] flex items-center justify-center p-4">
          <div class="w-full max-w-sm bg-white rounded-3xl shadow-sm border border-[#E2E8F0] p-8 text-center animate-fade-up">

          </div>
        </div>
      `;
    }

    function renderCurrentRoute() {
      if (state.route === 'admin') {
        if (state.adminUser) {
          renderAdminLayout();

          renderAuthLoadingScreen();
        } else {
          state.route = 'login';
          updateAppHistory('login', { replace: true });

        }
      } else if (state.route === 'login') {
        renderLoginScreen();
      } else {
        state.route = 'public';
        renderPublicScreen();
      }
    }

    function navigateToApp(route, options = {}) {
      const nextRoute = route === 'admin' || route === 'login' ? route : 'public';

      if (nextRoute === 'admin') {
        state.route = 'admin';
        state.adminTab = normalizeAdminTab(options.adminTab || state.pendingAdminTab || state.adminTab);
        state.pendingAdminTab = null;
      } else if (nextRoute === 'login') {
        state.route = 'login';
      } else {
        state.route = 'public';
        state.publicMode = normalizePublicMode(options.publicMode || 'idle');
        if (state.publicMode === 'idle') state.publicResult = null;
      }

      updateAppHistory(nextRoute, {
        adminTab: state.adminTab,
        publicMode: state.publicMode,
        replace: options.replace === true
      });
      renderCurrentRoute();
      if (nextRoute === 'public') {
        window.setTimeout(showInstallPromptIfAvailable, 300);
      }
    }

    function restoreRouteFromLocation() {
      const parsed = parseAppLocation();

      if (parsed.route === 'admin') {
        state.pendingAdminTab = parsed.adminTab;
        if (!state.authReady && !IS_PREVIEW) {
          state.route = 'admin';
          renderAuthLoadingScreen();
          return;
        }
        if (state.adminUser) {
          state.route = 'admin';
          state.adminTab = parsed.adminTab;
          renderAdminLayout();
        } else {
          state.route = 'login';
          updateAppHistory('login', { replace: true });
          renderLoginScreen();
        }
        return;
      }

      state.route = parsed.route;
      if (parsed.route === 'public') {
        state.publicMode = parsed.publicMode === 'result' && !state.publicResult
          ? 'idle'
          : parsed.publicMode;
        if (state.publicMode === 'idle' && parsed.publicMode === 'result') {
          updateAppHistory('public', { publicMode: 'idle', replace: true });
        }
      }
      renderCurrentRoute();
    }

    async function handleBrowserNavigation() {
      const parsed = parseAppLocation();
      if (state.publicMode === 'qr' && !(parsed.route === 'public' && parsed.publicMode === 'qr')) {
        await stopQrScannerIfRunning();
      }

      if (parsed.route === 'admin') {
        state.pendingAdminTab = parsed.adminTab;
        if (!state.authReady && !IS_PREVIEW) {
          state.route = 'admin';
          renderAuthLoadingScreen();
          return;
        }
        if (!state.adminUser) {
          state.route = 'login';
          updateAppHistory('login', { replace: true });
          renderLoginScreen();
          return;
        }
        state.route = 'admin';
        state.adminTab = parsed.adminTab;
        renderAdminLayout();
        return;
      }

      state.route = parsed.route;
      if (parsed.route === 'public') {
        state.publicMode = parsed.publicMode === 'result' && !state.publicResult
          ? 'idle'
          : parsed.publicMode;
      }
      renderCurrentRoute();
    }

    function getTeacherInitials(name) {
      if (!name) return 'GR';
      const clean = name.replace(/(Drs\.|Dra\.|Dr\.|Prof\.|H\.|Hj\.|S\.[A-Za-z.]+|M\.[A-Za-z.]+|Bsc\.|Ph\.D)/gi, '').trim();
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return (parts[0] ? parts[0].slice(0, 2) : 'GR').toUpperCase();
    }

    // -------------------------------------------------------------------------
    // MODUL 1: DASHBOARD ADMIN (Bento Grid + 4 Kartu Pastel + Kalender + Grafik)
    // -------------------------------------------------------------------------
    function computeDailySummary(dateStr, filterKategori = null) {
      const activeKategori = filterKategori || state.dashboardFilterKategori || 'all';
      const dObj = new Date(`${dateStr}T08:00:00+07:00`);
      const wibDayIdx = new Date(dObj.getTime() + 7 * 3600 * 1000).getUTCDay();
      const hariName = HARI_LIST[wibDayIdx];
      const activeYear = state.schoolYears.find(y => y.is_active);

      const activeTeachers = state.teachers.filter(t => t.status === 'aktif');

      // Ambil seluruh jadwal KBM yang aktif di hari ini
      const relevantSchedules = state.schedules.filter(s => {
        const matchDay = s.hari === hariName;
        const matchYear = activeYear ? s.school_year_id === activeYear.id : true;
        const matchKat = !s.kategori || s.kategori === 'KBM_REGULER';
        return matchDay && matchYear && matchKat;
      }).sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));

      let scheduledCount = 0;
      let hadirCount = 0;
      let terlambatCount = 0;
      let belumAbsenCount = 0;
      let tidakHadirCount = 0;
      let izinSakitCount = 0;

      const uniqueScheduledTeacherIds = new Set();
      const detailedRows = [];

      relevantSchedules.forEach(sched => {
        const t = activeTeachers.find(x => x.id === sched.teacher_id);
        if (!t) return;
        uniqueScheduledTeacherIds.add(t.id);
        scheduledCount++;

        const kInfo = getKategoriInfo(sched.kategori || 'KBM_REGULER');
        const sub = state.subjects.find(s => s.id === sched.subject_id);
        const cls = state.classes.find(c => c.id === sched.class_id);
        const title = sched.nama_tugas || (sub ? sub.nama_mapel : kInfo.label);
        const loc = sched.lokasi || (cls ? cls.nama_kelas : '-');

        const rec = state.attendanceRecords.find(
          r => r.teacher_id === t.id && r.schedule_id === sched.id && r.tanggal === dateStr
        );

        if (rec) {
          if (rec.status === 'Hadir') hadirCount++;
          else if (rec.status === 'Terlambat') terlambatCount++;
          else if (rec.status === 'Tidak Hadir') tidakHadirCount++;
          else if (rec.status === 'Izin' || rec.status === 'Sakit') izinSakitCount++;

          detailedRows.push({
            teacher: t,
            schedule: sched,
            kategori: sched.kategori || 'KBM_REGULER',
            katInfo: kInfo,
            judulTugas: title,
            lokasi: loc,
            jamJadwal: `${sched.jam_mulai}–${sched.jam_selesai}`,
            waktuAbsen: rec.waktu_absensi,
            status: rec.status,
            metode: rec.metode,
            menitTerlambat: rec.menit_terlambat || 0,
            isDispensasi: Boolean(rec.is_dispensasi)
          });
        } else {
          const missingStatus = evaluateMissingAttendanceStatus(sched, dateStr);
          if (missingStatus === 'Tidak Hadir') tidakHadirCount++;
          else belumAbsenCount++;

          detailedRows.push({
            teacher: t,
            schedule: sched,
            kategori: sched.kategori || 'KBM_REGULER',
            katInfo: kInfo,
            judulTugas: title,
            lokasi: loc,
            jamJadwal: `${sched.jam_mulai}–${sched.jam_selesai}`,
            waktuAbsen: '-',
            status: missingStatus,
            metode: '-',
            menitTerlambat: 0,
            isDispensasi: false
          });
        }
      });

      // Hitung metrik & ringkasan berbasis GURU (Orang) untuk Kartu Presensi
      let hadirTeacherCount = 0;
      let izinSakitTeacherCount = 0;
      let belumHadirTeacherCount = 0;
      const teacherSummaries = [];

      uniqueScheduledTeacherIds.forEach(tid => {
        const t = activeTeachers.find(x => x.id === tid);
        if (!t) return;
        const tScheds = relevantSchedules.filter(s => s.teacher_id === tid);
        const tRecs = state.attendanceRecords.filter(
          r => r.teacher_id === tid && r.tanggal === dateStr
        );

        let primaryStatus = 'Belum Hadir';
        let menitTerlambat = 0;
        let isDispensasi = false;
        let checkInTime = '-';

        const hadirRec = tRecs.find(r => r.status === 'Hadir' || r.status === 'Terlambat');
        const izinRec = tRecs.find(r => r.status === 'Izin' || r.status === 'Sakit');
        const tidakHadirRec = tRecs.find(r => r.status === 'Tidak Hadir');

        if (izinRec) {
          primaryStatus = izinRec.status;
          checkInTime = izinRec.waktu_absensi || '-';
          izinSakitTeacherCount++;
        } else if (hadirRec) {
          primaryStatus = hadirRec.status;
          menitTerlambat = hadirRec.menit_terlambat || 0;
          isDispensasi = Boolean(hadirRec.is_dispensasi);
          checkInTime = hadirRec.waktu_absensi || '-';
          hadirTeacherCount++;
        } else if (tidakHadirRec) {
          primaryStatus = 'Tidak Hadir';
          belumHadirTeacherCount++;
        } else {
          const anyMissing = tScheds.some(s => evaluateMissingAttendanceStatus(s, dateStr) === 'Tidak Hadir');
          primaryStatus = anyMissing ? 'Tidak Hadir' : 'Belum Hadir';
          belumHadirTeacherCount++;
        }

        const subjectNames = [...new Set(tScheds.map(s => {
          const sub = state.subjects.find(x => x.id === s.subject_id);
          return sub ? sub.nama_mapel : s.nama_tugas || 'KBM';
        }))];
        const classNames = [...new Set(tScheds.map(s => {
          const c = state.classes.find(x => x.id === s.class_id);
          return c ? c.nama_kelas : s.lokasi || '';
        }).filter(Boolean))];

        const earliestStart = tScheds[0]?.jam_mulai || '';
        const latestEnd = tScheds[tScheds.length - 1]?.jam_selesai || '';
        const timeRange = earliestStart && latestEnd ? `${earliestStart}–${latestEnd}` : '-';

        teacherSummaries.push({
          teacher: t,
          status: primaryStatus,
          menitTerlambat,
          isDispensasi,
          checkInTime,
          timeRange,
          classesCount: tScheds.length,
          subjectText: subjectNames.join(', '),
          classText: classNames.join(', ')
        });
      });

      const presentTotal = hadirCount + terlambatCount;
      const percentage = scheduledCount > 0 ? Math.round((presentTotal / scheduledCount) * 100) : 0;

      return {
        dateStr,
        hariName,
        totalActiveTeachers: activeTeachers.length,
        scheduledTeacherCount: uniqueScheduledTeacherIds.size,
        hadirTeacherCount,
        izinSakitTeacherCount,
        belumHadirTeacherCount,
        scheduledCount,
        hadirCount,
        terlambatCount,
        belumAbsenCount,
        tidakHadirCount,
        izinSakitCount,
        percentage,
        detailedRows,
        teacherSummaries
      };
    }

    function renderAttendanceDonutSvg(summary) {
      const total = summary.scheduledTeacherCount || 0;
      const hadir = summary.hadirTeacherCount || 0;
      const izin = summary.izinSakitTeacherCount || 0;
      const belum = summary.belumHadirTeacherCount || 0;

      const r = 38;
      const c = 2 * Math.PI * r; // ~238.761

      if (total === 0) {
        return `
          <svg viewBox="0 0 100 100" class="w-36 h-36 sm:w-44 sm:h-44 transform -rotate-90">
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="#F1F5F9" stroke-width="15" />
          </svg>
        `;
      }

      // Hitung panjang busur lingkaran tiap segmen
      const hadirArc = (hadir / total) * c;
      const izinArc = (izin / total) * c;
      const belumArc = (belum / total) * c;

      const hadirOffset = 0;
      const izinOffset = -hadirArc;
      const belumOffset = -(hadirArc + izinArc);

      return `
        <svg viewBox="0 0 100 100" class="w-36 h-36 sm:w-44 sm:h-44 transform -rotate-90 overflow-visible">
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="#F1F5F9" stroke-width="15" />
          ${hadir > 0 ? `<circle class="donut-slice cursor-pointer transition-all duration-200" data-label="Hadir" data-color="#2563EB" data-count="${hadir}" cx="50" cy="50" r="${r}" fill="none" stroke="#2563EB" stroke-width="15" stroke-dasharray="${hadirArc.toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${hadirOffset.toFixed(2)}" stroke-linecap="butt" />` : ''}
          ${izin > 0 ? `<circle class="donut-slice cursor-pointer transition-all duration-200" data-label="Izin / Sakit" data-color="#F59E0B" data-count="${izin}" cx="50" cy="50" r="${r}" fill="none" stroke="#F59E0B" stroke-width="15" stroke-dasharray="${izinArc.toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${izinOffset.toFixed(2)}" stroke-linecap="butt" />` : ''}

      // Donut Tooltip Hover Interactivity (Gaya Rapor Video)
      const donutWrapper = document.getElementById('donut-chart-container');
      const tooltip = document.getElementById('donut-tooltip');
      const tooltipSwatch = document.getElementById('donut-tooltip-swatch');
      const tooltipCount = document.getElementById('donut-tooltip-count');
      const tooltipCaret = document.getElementById('donut-tooltip-caret');

      if (donutWrapper && tooltip) {
        const slices = donutWrapper.querySelectorAll('.donut-slice');
        let hideTimeout = null;

        const updateTooltip = (e, slice) => {
          const rect = donutWrapper.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const mouseX = clientX - rect.left;
          const mouseY = clientY - rect.top;
          const centerX = rect.width / 2;

          const tooltipW = tooltip.offsetWidth || 52;
          const tooltipH = tooltip.offsetHeight || 28;

          if (tooltipSwatch && slice) tooltipSwatch.style.backgroundColor = slice.dataset.color;
          if (tooltipCount && slice) tooltipCount.textContent = slice.dataset.count;

          if (mouseX < centerX) {
            // Sisi Kiri -> Tooltip di sebelah kanan kursor, caret menunjuk ke kiri
            const left = Math.min(rect.width - tooltipW - 4, mouseX + 16);
            const top = Math.max(4, Math.min(rect.height - tooltipH - 4, mouseY - tooltipH / 2));
            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            if (tooltipCaret) {
              tooltipCaret.className = 'absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-[#2D3748] rotate-45 border-l border-b border-white/10';
            }
          } else {
            // Sisi Kanan -> Tooltip di sebelah kiri kursor, caret menunjuk ke kanan
            const left = Math.max(4, mouseX - tooltipW - 16);
            const top = Math.max(4, Math.min(rect.height - tooltipH - 4, mouseY - tooltipH / 2));
            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            if (tooltipCaret) {
              tooltipCaret.className = 'absolute -right-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-[#2D3748] rotate-45 border-r border-t border-white/10';
            }
          }

          tooltip.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
          tooltip.classList.add('opacity-100', 'scale-100');
        };

        const hideTooltip = () => {
          hideTimeout = setTimeout(() => {
            tooltip.classList.remove('opacity-100', 'scale-100');
            tooltip.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            slices.forEach(s => {
              s.setAttribute('stroke-width', '15');
              s.style.filter = 'none';
            });
          }, 40);
        };

        slices.forEach(slice => {
          slice.addEventListener('mouseenter', (e) => {
            if (hideTimeout) {
              clearTimeout(hideTimeout);
              hideTimeout = null;
            }
            slices.forEach(s => {
              if (s !== slice) {
                s.setAttribute('stroke-width', '15');
                s.style.filter = 'none';
              }
            });
            updateTooltip(e, slice);
            slice.setAttribute('stroke-width', '17');
            slice.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,0.22))';
          });

          slice.addEventListener('mousemove', (e) => {
            if (hideTimeout) {
              clearTimeout(hideTimeout);
              hideTimeout = null;
            }
            updateTooltip(e, slice);
          });

          slice.addEventListener('mouseleave', () => {
            hideTooltip();
          });

          slice.addEventListener('touchstart', (e) => {
            if (hideTimeout) {
              clearTimeout(hideTimeout);
              hideTimeout = null;
            }
            updateTooltip(e, slice);
            slice.setAttribute('stroke-width', '17');
          }, { passive: true });
        });

        donutWrapper.addEventListener('mouseleave', hideTooltip);
      }

      // Calendar Day Clicks

    function renderStatusBadge(status, menitTerlambat = 0, isDispensasi = false) {

    function renderInteractiveCalendar() {
      const y = state.dashboardCalendarYear;
      const m = state.dashboardCalendarMonth;
      const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
      const offset = firstDay === 0 ? 6 : firstDay - 1; // Mon=0
      const daysInMonth = new Date(y, m + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < offset; i++) {
        cells += `<div></div>`;
      }
      const nowJakarta = getJakartaNow();
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isSelected = state.dashboardDate === ds;

            isSelected
              ? 'bg-[#2563EB] text-white shadow-sm ring-2 ring-[#2563EB]/30'
              : isToday
                ? 'border-2 border-[#2563EB] text-[#2563EB] hover:bg-[#EFF6FF]'
                : 'text-[#475569] hover:bg-[#EFF6FF] hover:text-[#2563EB]'
          }" title="${ds}">${d}</button>
