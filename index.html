            ${cells}
          </div>
        </div>
      `;
    }

    function renderWeeklySvgChart(days) {
      const maxVal = Math.max(5, ...days.map(d => d.count));
      const width = 300;
      const height = 115;
      const pts = days.map((d, idx) => {
        const x = 20 + (idx * (width - 40)) / (days.length - 1);
        const y = height - 26 - ((d.count / maxVal) * (height - 48));
        return { x, y, ...d };
      });
      const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const areaD = `${pathD} L ${pts[pts.length - 1].x.toFixed(1)} ${height - 20} L ${pts[0].x.toFixed(1)} ${height - 20} Z`;

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-32 overflow-visible">
          <defs>
            <linearGradient id="purpleArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#purpleArea)" />
          <path d="${pathD}" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          ${pts.map(p => `
            <g class="cursor-pointer group">
              <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" class="transition-all duration-200" />
              <text x="${p.x}" y="${Math.max(12, p.y - 7)}" text-anchor="middle" font-size="9" fill="#2563EB" font-weight="800">${p.count}</text>
              <text x="${p.x}" y="${height - 4}" text-anchor="middle" font-size="9" fill="#94A3B8" font-weight="600">${p.shortDay}</text>
            </g>
          `).join('')}
        </svg>
      `;
    }

    function renderStatusDonutChart(summary) {
      const total = Math.max(1, summary.hadirCount + summary.terlambatCount + summary.tidakHadirCount + summary.izinSakitCount);
      const items = [
        { label: 'Hadir', count: summary.hadirCount, color: '#34D399' },
        { label: 'Terlambat', count: summary.terlambatCount, color: '#F59E0B' },
        { label: 'Tidak Hadir', count: summary.tidakHadirCount, color: '#F43F5E' },
        { label: 'Izin / Sakit', count: summary.izinSakitCount, color: '#2563EB' }
      ];

      let acc = 0;
      const radius = 36;
      const circumference = 2 * Math.PI * radius;

      const circles = items.map(it => {
        const pct = it.count / total;
        const dash = pct * circumference;
        const offset = -acc * circumference;
        acc += pct;
        if (it.count === 0) return '';
        return `<circle cx="48" cy="48" r="${radius}" fill="transparent" stroke="${it.color}" stroke-width="11" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" />`;
      }).join('');

      return `
        <div class="flex items-center gap-4">
          <div class="relative w-28 h-28 shrink-0 flex items-center justify-center">
            <svg viewBox="0 0 96 96" class="w-full h-full -rotate-90">
              <circle cx="48" cy="48" r="${radius}" fill="transparent" stroke="#F8FAFC" stroke-width="11" />
              ${circles}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
              <span class="text-xs font-extrabold text-[#0F172A] tabular-nums leading-none">${summary.percentage}%</span>
              <span class="text-[9px] font-bold text-[#94A3B8] mt-0.5">Kehadiran</span>
            </div>
          </div>
          <div class="flex-1 space-y-2">
            ${items.map(it => `
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${it.color}"></span>
                  <span class="text-[#475569] font-medium">${it.label}</span>
                </div>
                <span class="font-bold text-[#0F172A] tabular-nums">${it.count}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // MODUL 2: MANAJEMEN DATA GURU (TABEL MINIMALIS MODERN SESUAI APLIKASI RAPOR)
    // -------------------------------------------------------------------------
    function renderTeachersModule(container) {
      const pageSize = Number(state.teacherPageSize) || 10;
      let currentPage = Number(state.teacherPage) || 1;

      function getFilteredTeachers() {
        const q = (state.teacherSearch || state.searchGlobal || '').trim().toLowerCase();
        return state.teachers.filter(t => {
          const matchStatus = state.teacherFilterStatus === 'all' || t.status === state.teacherFilterStatus;
          const matchQuery = !q ||
            (t.nama_lengkap || '').toLowerCase().includes(q) ||
            (t.kode_guru || '').toLowerCase().includes(q) ||
            (t.nip || '').toLowerCase().includes(q) ||
            (t.nuptk || '').toLowerCase().includes(q) ||
            (t.nip_nuptk || '').toLowerCase().includes(q);
          return matchStatus && matchQuery;
        });
      }

      function updateTableContent() {
        const filtered = getFilteredTeachers();
        const totalFiltered = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalFiltered / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        state.teacherPage = currentPage;

        const startIdx = (currentPage - 1) * pageSize;
        const endIdx = Math.min(startIdx + pageSize, totalFiltered);
        const pageItems = filtered.slice(startIdx, endIdx);

        // Render TBody
        const tbody = document.getElementById('teacher-table-body');
        if (tbody) {
          if (pageItems.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" class="py-12 text-center text-xs sm:text-sm text-[#94A3B8]">
                  Tidak ada data guru yang sesuai.
                </td>
              </tr>
            `;
          } else {
            tbody.innerHTML = pageItems.map((t, idx) => {
              const rowNo = startIdx + idx + 1;
              const nipVal = t.nip || (t.nip_nuptk && !t.nuptk ? t.nip_nuptk : '') || '';
              const nuptkVal = t.nuptk || '';
              const jkVal = (t.jenis_kelamin || 'L').toUpperCase();
              const isAktif = (t.status || 'aktif') === 'aktif';

              return `
                <tr class="hover:bg-[#F8FAFC]/70 transition">
                  <td class="py-3 px-3 sm:px-4 text-center text-[#475569] font-medium">${rowNo}</td>
                  <td class="py-3 px-3 sm:px-4 font-semibold text-[#0F172A] whitespace-nowrap">${escapeHtml(t.nama_lengkap)}</td>
                  <td class="py-3 px-3 sm:px-4 text-center font-medium text-[#475569]">${jkVal}</td>
                  <td class="py-3 px-3 sm:px-4 text-[#475569] tabular-nums font-mono">${escapeHtml(nipVal)}</td>
                  <td class="py-3 px-3 sm:px-4 text-[#475569] tabular-nums font-mono">${escapeHtml(nuptkVal)}</td>
                  <td class="py-3 px-3 sm:px-4 font-semibold text-[#0F172A]">${isAktif ? 'AKTIF' : 'NONAKTIF'}</td>
                  <td class="py-3 px-3 sm:px-4 text-center whitespace-nowrap">
                    <div class="inline-flex items-center justify-center gap-1.5">
                      <button data-qr-tid="${t.id}" data-tooltip="Kartu Identitas QR" class="btn-view-qr w-8 h-8 rounded-lg bg-[#059669] hover:bg-[#047857] text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                      </button>
                      <button data-edit-tid="${t.id}" data-tooltip="Edit Profil Guru" class="btn-edit-teacher w-8 h-8 rounded-lg bg-[#D97706] hover:bg-[#B45309] text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      <button data-del-tid="${t.id}" data-tooltip="Hapus Data Guru" class="btn-del-teacher w-8 h-8 rounded-lg bg-[#DC2626] hover:bg-[#B91C1C] text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }

        // Render Pagination Info & Buttons
        const infoEl = document.getElementById('teacher-pagination-info');
        if (infoEl) {
          if (totalFiltered === 0) {
            infoEl.textContent = 'Menampilkan 0 data';
          } else {
            infoEl.textContent = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${totalFiltered} data`;
          }
        }

        const navEl = document.getElementById('teacher-pagination-nav');
        if (navEl) {
          let pagesHtml = '';
          for (let p = 1; p <= totalPages; p++) {
            if (p === currentPage) {
              pagesHtml += `
                <button class="w-8 h-8 rounded-lg bg-[#2563EB] text-white text-xs font-bold shadow-sm flex items-center justify-center">
                  ${p}
                </button>
              `;
            } else {
              pagesHtml += `
                <button data-goto-page="${p}" class="btn-goto-page w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white hover:bg-[#F8FAFC] text-[#475569] text-xs font-semibold flex items-center justify-center transition">
                  ${p}
                </button>
              `;
            }
          }

          navEl.innerHTML = `
            <button id="btn-page-prev" ${currentPage <= 1 ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white text-[#475569] hover:bg-[#F8FAFC] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition font-semibold text-xs">
              &laquo;
            </button>
            ${pagesHtml}
            <button id="btn-page-next" ${currentPage >= totalPages ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white text-[#475569] hover:bg-[#F8FAFC] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition font-semibold text-xs">
              &raquo;
            </button>
          `;

          const prevBtn = document.getElementById('btn-page-prev');
          if (prevBtn) {
            prevBtn.onclick = () => {
              if (currentPage > 1) {
                currentPage--;
                state.teacherPage = currentPage;
                updateTableContent();
              }
            };
          }

          const nextBtn = document.getElementById('btn-page-next');
          if (nextBtn) {
            nextBtn.onclick = () => {
              if (currentPage < totalPages) {
                currentPage++;
                state.teacherPage = currentPage;
                updateTableContent();
              }
            };
          }

          navEl.querySelectorAll('.btn-goto-page').forEach(btn => {
            btn.onclick = () => {
              currentPage = Number(btn.dataset.gotoPage);
              state.teacherPage = currentPage;
              updateTableContent();
            };
          });
        }

        // Re-attach row button listeners
        if (tbody) {
          tbody.querySelectorAll('.btn-view-qr').forEach(btn => {
            btn.onclick = () => {
              const t = state.teachers.find(x => x.id === btn.dataset.qrTid);
              if (t) openSingleQrCardModal(t);
            };
          });

          tbody.querySelectorAll('.btn-edit-teacher').forEach(btn => {
            btn.onclick = () => {
              const t = state.teachers.find(x => x.id === btn.dataset.editTid);
              if (t) openTeacherFormModal(t);
            };
          });

          tbody.querySelectorAll('.btn-del-teacher').forEach(btn => {
            btn.onclick = () => {
              const t = state.teachers.find(x => x.id === btn.dataset.delTid);
              if (!t) return;
              confirmDialog({
                title: 'Hapus Data Guru',
                message: `Hapus guru "${t.nama_lengkap}" (${t.kode_guru})? Data jadwal dan token QR terkait juga akan terpengaruh.`,
                onConfirm: async () => {
                  await dbAdapter.deleteDocument('teachers', t.id);
                  await recordAuditLog({
                    aksi: 'DELETE_TEACHER',
                    entitas: 'teachers',
                    target_id: t.id,
                    detail_perubahan: `Menghapus guru ${t.nama_lengkap} (${t.kode_guru})`
                  });
                  showToast('Data guru berhasil dihapus.', 'success');
                  renderAdminTabContent();
                }
              });
            };
          });
        }

        if (window.lucide) lucide.createIcons();
      }

      // Render Outer Layout Sesuai Referensi Aplikasi Rapor
      container.innerHTML = `
        <div class="space-y-4 animate-fade-up">
          <!-- Page Title Di Luar Card -->
          <div>
            <h2 class="text-2xl font-bold text-[#0F172A] tracking-tight">Data Guru</h2>
          </div>

          <!-- Main White Card -->
          <div class="bg-white rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-sm border border-[#E2E8F0] space-y-3.5 sm:space-y-4">
            <!-- Top Action Buttons Row (Responsive 1 Baris Sejajar di HP & Desktop) -->
            <div class="flex items-center justify-between gap-2">
              <button id="btn-add-teacher" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-xs sm:text-sm font-semibold inline-flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition shrink-0">
                <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
                <span class="whitespace-nowrap">Tambah Guru</span>
              </button>
              <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button id="btn-print-all-qr" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-white hover:bg-[#F8FAFC] text-[#475569] hover:text-[#0F172A] text-xs font-semibold border border-[#E2E8F0] inline-flex items-center justify-center gap-1.5 shadow-xs active:scale-95 transition">
                  <i data-lucide="printer" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="hidden md:inline">Cetak Semua QR</span>
                </button>
                <button id="btn-teacher-export-excel" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-white hover:bg-[#F8FAFC] text-[#475569] hover:text-[#0F172A] text-xs font-semibold border border-[#E2E8F0] inline-flex items-center justify-center gap-1.5 shadow-xs active:scale-95 transition">
                  <i data-lucide="download" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="hidden md:inline">Ekspor Excel</span>
                </button>
                <button id="btn-teacher-import-excel" class="px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-[#D97706] hover:bg-[#B45309] text-white text-xs sm:text-sm font-semibold inline-flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
                  <i data-lucide="upload" class="w-4 h-4 shrink-0"></i>
                  <span class="whitespace-nowrap">Import<span class="hidden sm:inline"> Data Guru</span></span>
                </button>
              </div>
            </div>

            <!-- Table Controls Toolbar (Tampilkan N data & Cari... Sejajar 1 Baris di HP & Desktop) -->
            <div class="flex items-center justify-between gap-2.5 pt-0.5">
              <div class="flex items-center gap-1 sm:gap-2 text-xs sm:text-sm text-[#475569] shrink-0">
                <span class="hidden sm:inline">Tampilkan</span>
                <select id="teacher-page-size" class="px-2 sm:px-2.5 py-1.5 rounded-lg bg-white border border-[#CBD5E1] text-xs sm:text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#2563EB] cursor-pointer">
                  <option value="10" ${pageSize === 10 ? 'selected' : ''}>10</option>
                  <option value="25" ${pageSize === 25 ? 'selected' : ''}>25</option>
                  <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
                  <option value="100" ${pageSize === 100 ? 'selected' : ''}>100</option>
                </select>
                <span>data</span>
              </div>
              <div class="relative flex-1 sm:flex-none max-w-xs sm:w-60">
                <i data-lucide="search" class="w-3.5 h-3.5 text-[#94A3B8] absolute left-2.5 sm:left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <input id="teacher-search-input" type="text" value="${escapeHtml(state.teacherSearch || '')}" placeholder="Cari..." class="w-full pl-8 pr-3 py-1.5 rounded-lg bg-white border border-[#CBD5E1] text-xs sm:text-sm text-[#0F172A] placeholder-[#94A3B8] focus:outline-none focus:border-[#2563EB]" />
              </div>
            </div>

            <!-- Tabel Data Guru (Header Bar Solid Biru, Baris Putih Bersih) -->
            <div class="overflow-x-auto">
              <table class="w-full text-left border-separate border-spacing-0 min-w-[680px]">
                <thead>
                  <tr class="bg-[#2563EB] text-white text-xs sm:text-sm font-semibold">
                    <th class="py-3 px-3 sm:px-4 text-center rounded-l-xl w-14">No.</th>
                    <th class="py-3 px-3 sm:px-4">Nama</th>
                    <th class="py-3 px-3 sm:px-4 text-center w-14">L/P</th>
                    <th class="py-3 px-3 sm:px-4">NIP</th>
                    <th class="py-3 px-3 sm:px-4">NUPTK</th>
                    <th class="py-3 px-3 sm:px-4">Status Guru</th>
                    <th class="py-3 px-3 sm:px-4 text-center rounded-r-xl w-32">Aksi</th>
                  </tr>
                </thead>
                <tbody id="teacher-table-body" class="divide-y divide-[#F1F5F9] text-xs sm:text-sm text-[#0F172A]"></tbody>
              </table>
            </div>

            <!-- Table Footer: Menampilkan X - Y dari Z data & Pagination Nav -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 text-xs sm:text-sm text-[#475569]">
              <div id="teacher-pagination-info"></div>
              <div id="teacher-pagination-nav" class="flex items-center gap-1.5 self-center sm:self-auto"></div>
            </div>
          </div>
        </div>
      `;

      // Event Listeners Toolbar & Actions
      document.getElementById('btn-add-teacher').onclick = () => openTeacherFormModal(null);
      document.getElementById('btn-teacher-import-excel').onclick = () => openTeacherExcelImportModal();
      document.getElementById('btn-teacher-export-excel').onclick = () => exportTeachersToExcel();
      document.getElementById('btn-print-all-qr').onclick = () => printTeacherQrCards(state.teachers.filter(t => t.status === 'aktif'));

      document.getElementById('teacher-page-size').onchange = (e) => {
        state.teacherPageSize = Number(e.target.value) || 10;
        currentPage = 1;
        state.teacherPage = 1;
        updateTableContent();
      };

      document.getElementById('teacher-search-input').oninput = (e) => {
        state.teacherSearch = e.target.value;
        currentPage = 1;
        state.teacherPage = 1;
        updateTableContent();
      };

      // Inisialisasi awal isi tabel
      updateTableContent();
    }

    function openTeacherFormModal(teacher = null) {
      const isEdit = Boolean(teacher);
      openModal(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-extrabold text-[#0F172A]">${isEdit ? 'Edit Data Guru' : 'Tambah Guru Baru'}</h3>
            <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-[#F8FAFC] hover:bg-[#F1F5F9] text-[#64748B] hover:text-[#0F172A] transition" aria-label="Tutup"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <form id="form-teacher" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">Kode Guru *</label>
                <input id="f-kode-guru" type="text" required value="${escapeHtml(teacher?.kode_guru || '')}" placeholder="Contoh: 1, 2, atau GR-01" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-bold focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">Nama Lengkap & Gelar *</label>
                <input id="f-nama" type="text" required value="${escapeHtml(teacher?.nama_lengkap || '')}" placeholder="Contoh: Drs. Ahmad Fauzi, M.Pd." class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-medium focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">NIP (Opsional)</label>
                <input id="f-nip" type="text" value="${escapeHtml(teacher?.nip || (teacher?.nip_nuptk && !teacher?.nuptk ? teacher.nip_nuptk : ''))}" placeholder="Contoh: 198504122010011005" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-medium focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">NUPTK (Opsional)</label>
                <input id="f-nuptk" type="text" value="${escapeHtml(teacher?.nuptk || '')}" placeholder="Contoh: 7640753654300022" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-medium focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">Jenis Kelamin *</label>
                <select id="f-jk" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-semibold focus:outline-none">
                  <option value="L" ${teacher?.jenis_kelamin === 'L' ? 'selected' : ''}>Laki-laki (L)</option>
                  <option value="P" ${teacher?.jenis_kelamin === 'P' ? 'selected' : ''}>Perempuan (P)</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-[#475569] mb-1">Status *</label>
                <select id="f-status" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-semibold focus:outline-none">
                  <option value="aktif" ${teacher?.status !== 'nonaktif' ? 'selected' : ''}>Aktif</option>
                  <option value="nonaktif" ${teacher?.status === 'nonaktif' ? 'selected' : ''}>Nonaktif</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-[#475569] mb-1">Nomor HP (Opsional)</label>
              <input id="f-hp" type="text" value="${escapeHtml(teacher?.no_hp || '')}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-medium focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold text-[#475569] mb-1">Alamat (Opsional)</label>
              <textarea id="f-alamat" rows="2" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FAFC] text-xs font-medium focus:bg-white focus:border-[#2563EB] border border-transparent focus:outline-none">${escapeHtml(teacher?.alamat || '')}</textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-[#F8FAFC] hover:bg-[#F1F5F9] text-xs font-bold text-[#475569] transition">Batal</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-xs font-bold">Simpan Data Guru</button>
            </div>
          </form>
        </div>
      `);

      document.getElementById('form-teacher').onsubmit = async (e) => {
        e.preventDefault();
        const kode_guru = document.getElementById('f-kode-guru').value.trim().toUpperCase();
        const nip = document.getElementById('f-nip').value.trim();
        const nuptk = document.getElementById('f-nuptk').value.trim();
        const nip_nuptk = nip || nuptk || '';
        const nama_lengkap = document.getElementById('f-nama').value.trim();
        const jenis_kelamin = document.getElementById('f-jk').value;
        const status = document.getElementById('f-status').value;
        const no_hp = document.getElementById('f-hp').value.trim();
        const alamat = document.getElementById('f-alamat').value.trim();

        // Validasi Duplikasi Kode Guru
        const dup = state.teachers.find(x => x.kode_guru.toUpperCase() === kode_guru && x.id !== teacher?.id);
        if (dup) {
          showToast(`Kode Guru "${kode_guru}" sudah digunakan oleh ${dup.nama_lengkap}.`, 'error');
          return;
        }

        const jakarta = getJakartaNow();
        if (isEdit) {
          await dbAdapter.setDocument('teachers', teacher.id, {
            ...teacher,
            kode_guru,
            nip,
            nuptk,
            nip_nuptk,
            nama_lengkap,
            jenis_kelamin,
            status,
            no_hp,
            alamat,
            updated_at: jakarta.isoTimestamp
          });
          await recordAuditLog({
            aksi: 'UPDATE_TEACHER',
            entitas: 'teachers',
            target_id: teacher.id,
            detail_perubahan: `Memperbarui data guru ${nama_lengkap} (${kode_guru})`
          });
          showToast('Data guru berhasil diperbarui.', 'success');
        } else {
          const newTeacherId = await dbAdapter.addDocument('teachers', {
            kode_guru,
            nip,
            nuptk,
            nip_nuptk,
            nama_lengkap,
            jenis_kelamin,
            status,
            no_hp,
            alamat,
            foto_url: '',
            created_at: jakarta.isoTimestamp
          });
          // Otomatis buatkan Token QR Unik untuk guru baru
          const token = generateRandomToken();
          await dbAdapter.setDocument('qr_tokens', token, {
            token,
            teacher_id: newTeacherId,
            is_active: true,
            created_at: jakarta.isoTimestamp
          });
          await recordAuditLog({
            aksi: 'CREATE_TEACHER',
            entitas: 'teachers',
            target_id: newTeacherId,
            detail_perubahan: `Menambahkan guru baru ${nama_lengkap} (${kode_guru}) + Token QR`
          });
          showToast('Guru baru & Token QR berhasil dibuat.', 'success');
        }
        closeModal();
        renderAdminTabContent();
      };
    }

    function openSingleQrCardModal(teacher) {
      const cfg = state.settings || getDefaultSettings();
      let tokenObj = state.qrTokens.find(q => q.teacher_id === teacher.id && q.is_active);
      if (!tokenObj) tokenObj = state.qrTokens.find(q => q.teacher_id === teacher.id);

      openModal(`
        <div class="p-6 text-center">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-extrabold text-[#0F172A]">Kartu Identitas QR Guru</h3>
            <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-[#F8FAFC] hover:bg-[#F1F5F9] text-[#64748B] hover:text-[#0F172A] transition" aria-label="Tutup"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

    // =========================================================================
    // EXCEL STYLING, TEMPLATE & PARSER HELPERS (xlsx-js-style)
    // =========================================================================
    function buildStyledExcelSheet(headers, rows, options = {}) {
      const {
        colWidths = [],
        textCols = [],
        centerCols = [],
        headerColor = '2563EB',
        headerHeight = 28,
        rowHeight = 22,
        extraBlankRows = 0
      } = options;

      const aoa = [headers, ...rows];
      for (let i = 0; i < extraBlankRows; i++) {
        aoa.push(headers.map(() => ''));
      }

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const borderThin = {
        top: { style: 'thin', color: { rgb: 'CBD5E1' } },
        bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
        left: { style: 'thin', color: { rgb: 'CBD5E1' } },
        right: { style: 'thin', color: { rgb: 'CBD5E1' } }
      };
      const borderHeader = {
        top: { style: 'thin', color: { rgb: '1D4ED8' } },
        bottom: { style: 'medium', color: { rgb: '1E40AF' } },
        left: { style: 'thin', color: { rgb: '1D4ED8' } },
        right: { style: 'thin', color: { rgb: '1D4ED8' } }
      };

      const totalRows = aoa.length;
      const totalCols = headers.length;

      for (let r = 0; r < totalRows; r++) {
        for (let c = 0; c < totalCols; c++) {
          const ref = XLSX.utils.encode_cell({ r, c });
          if (!ws[ref]) ws[ref] = { t: 's', v: '' };

          if (r === 0) {
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: headerColor } },
              font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'FFFFFF' } },
              alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
              border: borderHeader
            };
          } else {
            const isTextCol = textCols.includes(c);
            const isCenterCol = centerCols.includes(c);
            const isBlankTemplateRow = r > rows.length;
            if (isTextCol) {
              ws[ref].t = 's';
              ws[ref].z = '@';
              ws[ref].v = ws[ref].v !== undefined && ws[ref].v !== null ? String(ws[ref].v) : '';
            }
            ws[ref].s = {
              fill: {
                patternType: 'solid',
                fgColor: { rgb: isBlankTemplateRow ? 'FFFFFF' : (r % 2 === 0 ? 'F8FAFC' : 'FFFFFF') }
              },
              font: { name: 'Calibri', sz: 10.5, color: { rgb: '0F172A' } },
              alignment: { horizontal: isCenterCol ? 'center' : 'left', vertical: 'center', wrapText: true },
              border: borderThin,
              ...(isTextCol ? { numFmt: '@' } : {})
            };
          }
        }
      }

      ws['!cols'] = headers.map((h, c) => {
        if (colWidths[c]) return { wch: colWidths[c] };
        let maxLen = String(h || '').length;
        rows.forEach(row => {
          const valLen = String(row[c] ?? '').length;
          if (valLen > maxLen) maxLen = valLen;
        });
        return { wch: Math.min(Math.max(maxLen + 5, 12), 42) };
      });

      ws['!rows'] = aoa.map((_, r) => ({ hpt: r === 0 ? headerHeight : rowHeight }));
      return ws;
    }

    function buildGuideAndReferenceSheet(title, subtitle, guideRows, refSections = []) {
      const aoa = [
        [title, '', '', ''],
        [subtitle, '', '', ''],
        ['', '', '', ''],
        ['Nama Kolom', 'Sifat', 'Format & Contoh', 'Keterangan Pengisian']
      ];

      guideRows.forEach(gr => aoa.push(gr));

      const sectionHeaderRowIndices = [];
      const refHeaderRowIndices = [];

      refSections.forEach(sec => {
        aoa.push(['', '', '', '']);
        sectionHeaderRowIndices.push(aoa.length);
        aoa.push([sec.title, '', '', '']);
        refHeaderRowIndices.push(aoa.length);
        aoa.push(sec.headers);
        if (sec.rows.length === 0) {
          aoa.push(['(Belum ada data terdaftar di aplikasi)', '', '', '']);
        } else {
          sec.rows.forEach(r => {
            const padded = [...r];
            while (padded.length < 4) padded.push('');
            aoa.push(padded);
          });
        }
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges'] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } },
        { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } },
        ...sectionHeaderRowIndices.map(rIdx => ({ s: { r: rIdx, c: 0 }, e: { r: rIdx, c: 3 } }))
      ];

      const borderThin = {
        top: { style: 'thin', color: { rgb: 'CBD5E1' } },
        bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
        left: { style: 'thin', color: { rgb: 'CBD5E1' } },
        right: { style: 'thin', color: { rgb: 'CBD5E1' } }
      };

      const guideStart = 3;
      const guideEnd = 3 + guideRows.length;

      for (let r = 0; r < aoa.length; r++) {
        for (let c = 0; c < 4; c++) {
          const ref = XLSX.utils.encode_cell({ r, c });
          if (!ws[ref]) ws[ref] = { t: 's', v: '' };

          if (r === 0) {
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: '1E3A8A' } },
              font: { name: 'Calibri', sz: 13, bold: true, color: { rgb: 'FFFFFF' } },
              alignment: { horizontal: 'left', vertical: 'center' }
            };
          } else if (r === 1) {
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: 'EFF6FF' } },
              font: { name: 'Calibri', sz: 10, italic: true, color: { rgb: '1E40AF' } },
              alignment: { horizontal: 'left', vertical: 'center' }
            };
          } else if (r === guideStart || refHeaderRowIndices.includes(r)) {
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: '2563EB' } },
              font: { name: 'Calibri', sz: 10.5, bold: true, color: { rgb: 'FFFFFF' } },
              alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
              border: borderThin
            };
          } else if (sectionHeaderRowIndices.includes(r)) {
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: 'DBEAFE' } },
              font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: '1E3A8A' } },
              alignment: { horizontal: 'left', vertical: 'center' },
              border: borderThin
            };
          } else if ((r > guideStart && r <= guideEnd) || aoa[r].some(v => v !== '')) {
            ws[ref].t = 's';
            ws[ref].z = '@';
            ws[ref].s = {
              fill: { patternType: 'solid', fgColor: { rgb: r % 2 === 0 ? 'F8FAFC' : 'FFFFFF' } },
              font: { name: 'Calibri', sz: 10, bold: c === 0 && r <= guideEnd, color: { rgb: '0F172A' } },
              alignment: { horizontal: c === 1 && r <= guideEnd ? 'center' : 'left', vertical: 'center', wrapText: true },
              border: borderThin,
              numFmt: '@'
            };
          }
        }
      }

      ws['!cols'] = [{ wch: 24 }, { wch: 18 }, { wch: 28 }, { wch: 52 }];
      ws['!rows'] = aoa.map((_, r) => ({
        hpt: r === 0 ? 30 : (r === guideStart || refHeaderRowIndices.includes(r) || sectionHeaderRowIndices.includes(r) ? 24 : 20)
      }));
      return ws;
    }

    function normalizeExcelRowKeys(row) {
      const out = {};
      Object.keys(row || {}).forEach(k => {
        out[String(k).trim().toLowerCase().replace(/\s+/g, '_')] = row[k];
      });
      return out;
    }

    function parseExcelTimeValue(val) {
      if (val === undefined || val === null || val === '') return '';
      if (typeof val === 'number' && !isNaN(val)) {
        const fraction = val % 1;
        const totalMins = Math.round(fraction * 24 * 60);
        const hh = String(Math.floor(totalMins / 60) % 24).padStart(2, '0');
        const mm = String(totalMins % 60).padStart(2, '0');
        return `${hh}:${mm}`;
      }
      if (val instanceof Date && !isNaN(val.getTime())) {
        return `${String(val.getHours()).padStart(2, '0')}:${String(val.getMinutes()).padStart(2, '0')}`;
      }
      const cleaned = String(val).trim().replace('.', ':');
      const m = cleaned.match(/^(\d{1,2}):(\d{2})/);
      if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
      return cleaned;
    }

        t.nuptk || '',
        (t.status || 'aktif') === 'aktif' ? 'AKTIF' : 'NONAKTIF',
        t.no_hp || '',
        t.alamat || ''
      ]);
      const ws = buildStyledExcelSheet(headers, rows, {
        colWidths: [6, 13, 30, 7, 22, 20, 14, 16, 32],
        textCols: [1, 4, 5, 7],
        centerCols: [0, 1, 3, 6]
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data Guru');
      XLSX.writeFile(wb, `Data_Guru_HadirGuru_${getJakartaNow().dateStr}.xlsx`);

    // -------------------------------------------------------------------------
    // MODUL 6: JADWAL MENGAJAR & TUGAS (HARIAN, MINGGUAN, MULTI-PERAN, BENTROK)
    // -------------------------------------------------------------------------
    function checkScheduleConflict({ id = null, teacher_id, class_id = null, school_year_id, hari, jam_mulai, jam_selesai, kategori = 'KBM_REGULER' }) {
      const startA = timeToMinutes(jam_mulai);
      const endA = timeToMinutes(jam_selesai);
      if (endA <= startA) {
        return 'Jam selesai harus lebih besar daripada jam mulai.';
      }

      for (const s of state.schedules) {
        if (id && s.id === id) continue;
        if (s.school_year_id !== school_year_id || s.hari !== hari) continue;

        const startB = timeToMinutes(s.jam_mulai);
        const endB = timeToMinutes(s.jam_selesai);
        const overlaps = startA < endB && endA > startB;
        if (!overlaps) continue;

        if (s.teacher_id === teacher_id) {
          const sKat = getKategoriInfo(s.kategori || 'KBM_REGULER');
          const title = s.nama_tugas || (state.subjects.find(sub => sub.id === s.subject_id)?.nama_mapel) || sKat.label;
          return `Bentrok Jadwal Guru! Guru ini sudah memiliki tugas [${sKat.label}] "${title}" pada pukul ${s.jam_mulai}–${s.jam_selesai}.`;
        }
        if (class_id && s.class_id && s.class_id === class_id) {
          const tch = state.teachers.find(t => t.id === s.teacher_id);
          const cls = state.classes.find(c => c.id === s.class_id);
          return `Bentrok Jadwal Kelas! Kelas ${cls?.nama_kelas || '-'} sudah diisi oleh ${tch?.nama_lengkap || '-'} pada pukul ${s.jam_mulai}–${s.jam_selesai}.`;
        }
      }
      return null;
    }

    function renderSchedulesModule(container) {
      const activeYear = state.schoolYears.find(y => y.is_active);
      const pageSize = Number(state.schedulePageSize) || 10;
      let currentPage = Number(state.schedulePage) || 1;

      function getBaseSchedules() {
        return state.schedules
          .filter(s => {
            if (activeYear && s.school_year_id !== activeYear.id) return false;
            if (state.scheduleViewMode === 'daily' && s.hari !== state.scheduleFilterDay) return false;
            if (s.kategori && s.kategori !== 'KBM_REGULER') return false;
            if (state.scheduleFilterTeacher !== 'all' && s.teacher_id !== state.scheduleFilterTeacher) return false;
            if (state.scheduleFilterClass !== 'all' && s.class_id !== state.scheduleFilterClass) return false;
            if (state.scheduleFilterSubject !== 'all' && s.subject_id !== state.scheduleFilterSubject) return false;
            return true;
          })
          .sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));
      }

      function getFilteredDailySchedules() {
        const base = getBaseSchedules();
        const q = (state.scheduleSearch || state.searchGlobal || '').trim().toLowerCase();
        if (!q) return base;
        return base.filter(s => {
          const tch = state.teachers.find(t => t.id === s.teacher_id);
          const sub = state.subjects.find(x => x.id === s.subject_id);
          const cls = state.classes.find(c => c.id === s.class_id);
          return (tch?.nama_lengkap || '').toLowerCase().includes(q) ||
            (sub?.nama_mapel || '').toLowerCase().includes(q) ||
            (cls?.nama_kelas || '').toLowerCase().includes(q) ||
            String(s.jam_ke || '').includes(q) ||

                  <input id="sch-selesai" type="time" required value="${sch?.jam_selesai || '08:15'}" class="w-full px-2.5 py-2 rounded-xl bg-white border border-[#E2E8F0] text-xs font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-[#2563EB]/30" />

              </div>
              <p class="text-[10px] text-[#64748B] italic">Waktu otomatis terisi dari Template Jam Pelajaran hari terpilih, namun tetap bisa disesuaikan manual jika dibutuhkan.</p>

            <div class="flex justify-end gap-2 pt-2 border-t border-[#E2E8F0]">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#F8FAFC] hover:bg-[#E8EAF3] text-xs font-bold text-[#475569] transition">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-xs font-bold transition shadow-sm">Simpan Jadwal</button>
            </div>
          </form>
        </div>
      `, 'max-w-lg');

      lucide.createIcons();

      const elHari = document.getElementById('sch-hari');
      const elMulaiJam = document.getElementById('sch-jamke-mulai');
      const elSelesaiJam = document.getElementById('sch-jamke-selesai');
      const elWaktuMulai = document.getElementById('sch-mulai');
      const elWaktuSelesai = document.getElementById('sch-selesai');

      function updateSlotDropdowns(keepValues = true, targetStart = null, targetEnd = null) {
        const selectedHari = elHari.value;
        const currentSlots = getLessonSlotsForDay(selectedHari);

        const currentStart = targetStart !== null ? targetStart : (keepValues ? Number(elMulaiJam.value || initialStartJam) : 1);
        const currentEnd = targetEnd !== null ? targetEnd : (keepValues ? Number(elSelesaiJam.value || initialEndJam) : currentStart);

        elMulaiJam.innerHTML = currentSlots.map(sl =>
          `<option value="${sl.jam_ke}" ${sl.jam_ke === currentStart ? 'selected' : ''}>Jam ke-${sl.jam_ke}</option>`
        ).join('');

        elSelesaiJam.innerHTML = currentSlots.map(sl =>
          `<option value="${sl.jam_ke}" ${sl.jam_ke === currentEnd ? 'selected' : ''}>Jam ke-${sl.jam_ke}</option>`
        ).join('');

        const startVal = Number(elMulaiJam.value) || currentSlots[0]?.jam_ke || 1;
        let endVal = Number(elSelesaiJam.value) || startVal;
        if (endVal < startVal) {
          endVal = startVal;
          elSelesaiJam.value = String(endVal);
        }

        const startSlot = currentSlots.find(sl => sl.jam_ke === startVal);
        const endSlot = currentSlots.find(sl => sl.jam_ke === endVal);

        if (startSlot && (!keepValues || !sch)) elWaktuMulai.value = startSlot.jam_mulai;
        if (endSlot && (!keepValues || !sch)) elWaktuSelesai.value = endSlot.jam_selesai;
        initCustomSelects(elMulaiJam.closest('.custom-select-wrapper')?.parentNode || elMulaiJam.parentNode);
      }

      // Inisialisasi dropdown pertama kali
      updateSlotDropdowns(true, initialStartJam, initialEndJam);
      if (sch) {
        if (sch.jam_mulai) elWaktuMulai.value = sch.jam_mulai;
        if (sch.jam_selesai) elWaktuSelesai.value = sch.jam_selesai;
      }

      // Event saat hari diganti -> reload slot hari tersebut
      elHari.onchange = () => {
        updateSlotDropdowns(false);
      };

      // Event saat Mulai Jam Ke diganti
      elMulaiJam.onchange = () => {
        const selectedHari = elHari.value;
        const currentSlots = getLessonSlotsForDay(selectedHari);
        const startVal = Number(elMulaiJam.value);
        let endVal = Number(elSelesaiJam.value);

        if (endVal < startVal) {
          endVal = startVal;
          elSelesaiJam.value = String(endVal);
        }

        const startSlot = currentSlots.find(sl => sl.jam_ke === startVal);
        const endSlot = currentSlots.find(sl => sl.jam_ke === endVal);
        if (startSlot) elWaktuMulai.value = startSlot.jam_mulai;
        if (endSlot) elWaktuSelesai.value = endSlot.jam_selesai;
      };

      // Event saat Sampai Jam Ke diganti
      elSelesaiJam.onchange = () => {
        const selectedHari = elHari.value;
        const currentSlots = getLessonSlotsForDay(selectedHari);
        let startVal = Number(elMulaiJam.value);
        const endVal = Number(elSelesaiJam.value);

        if (startVal > endVal) {
          startVal = endVal;
          elMulaiJam.value = String(startVal);
        }

        const startSlot = currentSlots.find(sl => sl.jam_ke === startVal);
        const endSlot = currentSlots.find(sl => sl.jam_ke === endVal);
        if (startSlot) elWaktuMulai.value = startSlot.jam_mulai;
        if (endSlot) elWaktuSelesai.value = endSlot.jam_selesai;
      };

      document.getElementById('form-schedule').onsubmit = async (e) => {
        e.preventDefault();
        const subject_id = document.getElementById('sch-subject').value;
        const class_id = document.getElementById('sch-class').value;
        const sub = state.subjects.find(s => s.id === subject_id);
        const cls = state.classes.find(c => c.id === class_id);
        const startJam = Number(elMulaiJam.value);
        const endJam = Number(elSelesaiJam.value);

        const payload = {
          teacher_id: document.getElementById('sch-teacher').value,
          hari: elHari.value,
          kategori: 'KBM_REGULER',
          nama_tugas: sub?.nama_mapel || 'KBM',
          lokasi: cls?.nama_kelas || '',
          subject_id,
          class_id,
          jam_ke: startJam,
          jam_ke_selesai: endJam,
          jam_mulai: elWaktuMulai.value,
          jam_selesai: elWaktuSelesai.value,
          school_year_id: activeYear?.id || ''
        };

        const conflictMsg = checkScheduleConflict({ id: sch?.id, ...payload });
        if (conflictMsg) {
          showToast(conflictMsg, 'error');
          return;
        }

        if (sch) {
          await dbAdapter.setDocument('teaching_schedules', sch.id, payload);
        } else {
          await dbAdapter.addDocument('teaching_schedules', payload);
        }
        await recordAuditLog({
          aksi: sch ? 'UPDATE_SCHEDULE' : 'CREATE_SCHEDULE',
          entitas: 'teaching_schedules',
          target_id: sch?.id || 'NEW',
          detail_perubahan: `Jadwal KBM ${payload.hari} (Jam ${formatJamKeDisplay(payload.jam_ke, payload.jam_ke_selesai)}, ${payload.jam_mulai}-${payload.jam_selesai})`
        });
        closeModal();
        showToast('Jadwal KBM berhasil disimpan.', 'success');
        renderAdminTabContent();
      };
    }

    function openLessonSlotsModal() {

            jam_ke: idx + 1,
            jam_mulai: start,
            jam_selesai: end
          });
        });
        if (updated.length > 0) {
          daySlotsMap[activeDay] = updated;

                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-amber-500"></i> Reset
                </button>
              </div>
            </div>

            <!-- List Slot Jam -->
            <div id="slots-items-container" class="space-y-2 max-h-60 overflow-y-auto mb-3 pr-1">
              ${slots.map((sl, i) => `
                <div class="slot-row flex items-center gap-2 bg-[#F8FAFC] p-2 rounded-xl border border-[#E2E8F0]/60">
                  <span class="text-xs font-extrabold text-[#2563EB] w-18 shrink-0">Jam ke-${sl.jam_ke}</span>
                  <input type="time" value="${sl.jam_mulai}" class="slot-start-input px-2 py-1.5 rounded-lg bg-white border border-[#E2E8F0] text-xs font-bold tabular-nums w-24" />
                  <span class="text-xs text-[#94A3B8]">s.d.</span>
                  <input type="time" value="${sl.jam_selesai}" class="slot-end-input px-2 py-1.5 rounded-lg bg-white border border-[#E2E8F0] text-xs font-bold tabular-nums w-24" />
                  <button type="button" data-del-slot="${i}" ${slots.length <= 1 ? 'disabled' : ''} class="ml-auto p-1.5 rounded-lg text-rose-500 hover:bg-rose-50 disabled:opacity-30 disabled:pointer-events-none transition" title="Hapus Jam ke-${sl.jam_ke}">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-[#E2E8F0]">
              <button type="button" id="btn-add-slot-row" class="px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-[#2563EB] text-xs font-bold transition flex items-center gap-1.5">

      function showSubModal(contentHtml) {
        const overlay = document.getElementById('slots-submodal-overlay');
        const content = document.getElementById('slots-submodal-content');
        if (overlay && content) {
          content.innerHTML = contentHtml;
          overlay.classList.remove('hidden');
          lucide.createIcons();
        }
      }

      function hideSubModal() {
        const overlay = document.getElementById('slots-submodal-overlay');
        if (overlay) {
          overlay.classList.add('hidden');
        }
      }

      function bindEvents() {
        document.querySelectorAll('.tab-day-btn').forEach(btn => {
          btn.onclick = () => {
            const targetDay = btn.getAttribute('data-day');
            if (targetDay !== activeDay) {
              saveCurrentInputsToMemory();
              activeDay = targetDay;
              renderModalContent();
            }
          };
        });

        document.querySelectorAll('[data-del-slot]').forEach(btn => {
          btn.onclick = () => {
            saveCurrentInputsToMemory();
            const idx = Number(btn.getAttribute('data-del-slot'));
            const slots = daySlotsMap[activeDay];
            if (slots && slots.length > 1) {
              slots.splice(idx, 1);
              slots.forEach((s, i) => { s.jam_ke = i + 1; });
              renderModalContent();
            }
          };
        });

        const btnAdd = document.getElementById('btn-add-slot-row');
        if (btnAdd) {
          btnAdd.onclick = () => {
            saveCurrentInputsToMemory();
            const slots = daySlotsMap[activeDay] || [];
            const nextJamKe = slots.length + 1;
            let start = '12:00';
            let end = '12:40';
            if (slots.length > 0) {
              const last = slots[slots.length - 1];
              start = last.jam_selesai;
              const startMins = timeToMinutes(start);
              end = minutesToTime(startMins + 40);
            }
            slots.push({
              jam_ke: nextJamKe,
              jam_mulai: start,
              jam_selesai: end
            });
            daySlotsMap[activeDay] = slots;
            renderModalContent();
          };
        }

        const btnReset = document.getElementById('btn-reset-day-slots');
        if (btnReset) {
          btnReset.onclick = () => {
            showSubModal(`
              <div class="flex items-center justify-between pb-3 border-b border-[#E2E8F0]">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center shrink-0">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h4 class="text-sm font-bold text-[#0F172A]">Reset Jam Pelajaran</h4>
                    <p class="text-[11px] text-[#64748B]">Hari <strong>${activeDay}</strong></p>
                  </div>
                </div>
                <button type="button" id="btn-close-submodal" class="p-1.5 rounded-lg text-[#64748B] hover:bg-[#F8FAFC] hover:text-[#0F172A] transition" aria-label="Tutup">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="py-2">
                <p class="text-xs text-[#475569] leading-relaxed">
                  Apakah Anda yakin ingin mengembalikan susunan jam pelajaran hari <strong>${activeDay}</strong> ke standar bawaan sistem?
                </p>
                <p class="text-[11px] text-amber-700 mt-2.5 bg-amber-50 p-2.5 rounded-xl border border-amber-200">
                  Perubahan jam pada hari ini yang belum disimpan akan dikembalikan ke susunan awal.
                </p>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-[#E2E8F0]">
                <button type="button" id="btn-cancel-submodal" class="px-3.5 py-2 rounded-xl bg-[#F8FAFC] hover:bg-[#E8EAF3] text-xs font-bold text-[#475569] transition">Batal</button>
                <button type="button" id="btn-confirm-reset" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition shadow-sm flex items-center gap-1.5">
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Ya, Reset Jam
                </button>
              </div>
            `);

            document.getElementById('btn-close-submodal').onclick = hideSubModal;
            document.getElementById('btn-cancel-submodal').onclick = hideSubModal;

            document.getElementById('btn-confirm-reset').onclick = () => {
              daySlotsMap[activeDay] = createDefaultDaySlots(activeDay);
              hideSubModal();
              showToast(`Pengaturan jam hari ${activeDay} berhasil dikembalikan ke standar bawaan.`, 'success');
              renderModalContent();
            };
          };
        }

        const btnCopy = document.getElementById('btn-copy-day-slots');
        if (btnCopy) {
          btnCopy.onclick = () => {
            saveCurrentInputsToMemory();
            const otherDays = DAYS.filter(d => d !== activeDay);
            showSubModal(`
              <div class="flex items-center justify-between pb-3 border-b border-[#E2E8F0]">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-xl bg-blue-50 text-[#2563EB] flex items-center justify-center shrink-0">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h4 class="text-sm font-bold text-[#0F172A]">Salin Jam Pelajaran</h4>
                    <p class="text-[11px] text-[#64748B]">Dari hari <strong>${activeDay}</strong> (${daySlotsMap[activeDay].length} JP)</p>
                  </div>
                </div>
                <button type="button" id="btn-close-submodal" class="p-1.5 rounded-lg text-[#64748B] hover:bg-[#F8FAFC] hover:text-[#0F172A] transition" aria-label="Tutup">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="space-y-2.5 py-1">
                <p class="text-xs text-[#475569] font-medium">Pilih hari tujuan:</p>
                
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-[#EFF6FF] border border-[#BFDBFE] cursor-pointer hover:bg-blue-100/70 transition">
                  <input type="checkbox" id="chk-copy-all" class="w-4 h-4 rounded text-[#2563EB] accent-[#2563EB] cursor-pointer" />
                  <span class="text-xs font-bold text-[#1E40AF]">Pilih Semua</span>
                </label>

                <div class="grid grid-cols-2 gap-2 pt-1">
                  ${otherDays.map(d => `
                    <label class="flex items-center gap-2 p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] cursor-pointer hover:bg-white transition select-none">
                      <input type="checkbox" value="${d}" class="w-4 h-4 rounded text-[#2563EB] accent-[#2563EB] cursor-pointer chk-day-target" />
                      <span class="text-xs font-bold text-[#0F172A]">${d}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-[#E2E8F0]">
                <button type="button" id="btn-cancel-submodal" class="px-3.5 py-2 rounded-xl bg-[#F8FAFC] hover:bg-[#E8EAF3] text-xs font-bold text-[#475569] transition">Batal</button>
                <button type="button" id="btn-apply-copy" class="px-4 py-2 rounded-xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-xs font-bold transition shadow-sm flex items-center gap-1.5">
                  Terapkan
                </button>
              </div>
            `);

            const chkAll = document.getElementById('chk-copy-all');
            const dayCheckboxes = document.querySelectorAll('.chk-day-target');

            if (chkAll) {
              chkAll.onchange = (e) => {
                dayCheckboxes.forEach(cb => cb.checked = e.target.checked);
              };
            }

            dayCheckboxes.forEach(cb => {
              cb.onchange = () => {
                if (!cb.checked && chkAll) chkAll.checked = false;
                else if (chkAll && Array.from(dayCheckboxes).every(c => c.checked)) chkAll.checked = true;
              };
            });

            document.getElementById('btn-close-submodal').onclick = hideSubModal;
            document.getElementById('btn-cancel-submodal').onclick = hideSubModal;

            document.getElementById('btn-apply-copy').onclick = () => {
              const selected = Array.from(dayCheckboxes).filter(c => c.checked).map(c => c.value);
              if (selected.length === 0) {
                showToast('Silakan pilih minimal 1 hari tujuan salin.', 'error');
                return;
              }
              selected.forEach(d => {
                daySlotsMap[d] = JSON.parse(JSON.stringify(daySlotsMap[activeDay]));
              });
              hideSubModal();
              showToast(`Susunan jam hari ${activeDay} berhasil disalin ke hari ${selected.join(', ')}.`, 'success');
              renderModalContent();
            };
          };
        }

        const btnSave = document.getElementById('btn-save-slots');
        if (btnSave) {
          btnSave.onclick = async () => {
            saveCurrentInputsToMemory();

            for (const d of DAYS) {
              const slots = daySlotsMap[d] || [];
              if (slots.length === 0) {
                showToast(`Hari ${d} harus memiliki minimal 1 jam pelajaran.`, 'error');
                return;
              }
              for (const sl of slots) {
                if (!sl.jam_mulai || !sl.jam_selesai) {
                  showToast(`Hari ${d} Jam ke-${sl.jam_ke}: Waktu mulai dan selesai tidak boleh kosong.`, 'error');
                  return;
                }
                if (timeToMinutes(sl.jam_mulai) >= timeToMinutes(sl.jam_selesai)) {
                  showToast(`Hari ${d} Jam ke-${sl.jam_ke}: Jam selesai (${sl.jam_selesai}) harus lebih besar dari jam mulai (${sl.jam_mulai}).`, 'error');
                  return;
                }
              }
            }

            const updatedCfg = {
              ...cfg,
              lesson_slots_by_day: daySlotsMap,
              lesson_slots: daySlotsMap['Senin'] || cfg.lesson_slots
            };

            await dbAdapter.setDocument('attendance_settings', 'global_config', updatedCfg);
            state.settings = updatedCfg;

            await recordAuditLog({
              aksi: 'UPDATE_LESSON_SLOTS',
              entitas: 'attendance_settings',
              target_id: 'global_config',
              detail_perubahan: 'Memperbarui template jam pelajaran mingguan (Senin-Sabtu)'
            });

            closeModal();
            showToast('Pengaturan jam pelajaran mingguan berhasil disimpan.', 'success');
            renderAdminTabContent();
          };
        }
      }

      openModal('', 'max-w-xl');
      renderModalContent();
    }

    function openScheduleExcelImportModal() {
      let parsedSchedules = [];
      const activeYear = state.schoolYears.find(y => y.is_active) || state.schoolYears[0];

      openModal(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#E2E8F0]">
            <h3 class="text-base font-bold text-[#0F172A]">Impor Jadwal Mengajar KBM</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-[#F8FAFC] text-[#475569] hover:text-[#0F172A] transition"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="p-4 rounded-2xl bg-[#EFF6FF] border border-[#BFDBFE] mb-4 space-y-2">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="font-bold text-xs text-[#0F172A]">Template Jadwal KBM Guru</p>
                <p class="text-[11px] text-[#475569]">Kolom: <span class="font-semibold text-[#2563EB]">kode_guru, hari, kode_mapel, nama_kelas, jam_ke, jam_mulai, jam_selesai</span></p>
              </div>
              <button id="btn-dl-sch-template" class="px-3.5 py-2 rounded-xl bg-white text-[#2563EB] hover:bg-[#2563EB] hover:text-white text-xs font-bold shadow-sm transition active:scale-95 shrink-0 flex items-center gap-1.5">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Download Template

            </div>
            <div class="text-[11px] text-[#2563EB] bg-white/70 p-2.5 rounded-xl border border-blue-100">
              <p class="font-bold mb-0.5">Petunjuk Pengisian &amp; Sheet Referensi:</p>
              <ul class="list-disc list-inside space-y-0.5 text-[#475569]">
                <li><strong>Jam Gandeng / Blok:</strong> Isi rentang jam misalnya <code class="bg-white px-1 py-0.5 rounded font-bold text-[#0F172A]">1-2</code> atau <code class="bg-white px-1 py-0.5 rounded font-bold text-[#0F172A]">3-4</code>. Cukup 1 baris untuk 2 jam sekaligus!</li>
                <li><strong>Jam Tunggal / Bergantian:</strong> Isi satu angka misalnya <code class="bg-white px-1 py-0.5 rounded font-bold text-[#0F172A]">1</code> atau <code class="bg-white px-1 py-0.5 rounded font-bold text-[#0F172A]">3</code>.</li>
                <li><strong>Waktu Mulai &amp; Selesai:</strong> Opsional. Jika <code class="bg-white px-1 rounded">jam_mulai</code> &amp; <code class="bg-white px-1 rounded">jam_selesai</code> dikosongkan, sistem otomatis mengambil waktu dari Template Jam Pelajaran.</li>
                <li><strong>Daftar Kode Lengkap:</strong> Lihat Sheet ke-2 (<code class="bg-white px-1 rounded font-bold text-[#0F172A]">Petunjuk_&amp;_Referensi</code>) di dalam file Excel untuk menyalin Kode Guru, Mapel, &amp; Kelas aktif.</li>
              </ul>
            </div>
          </div>

          <input id="input-sch-excel-file" type="file" accept=".xlsx,.xls" class="w-full text-xs mb-4 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#2563EB] file:text-white cursor-pointer" />
