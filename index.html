            </div>
          </div>
        </div>
      `, 'max-w-3xl');

      lucide.createIcons();

      document.getElementById('btn-dl-sch-template').onclick = () => {
        if (!window.XLSX) {
          showToast('Library Excel belum siap.', 'error');
          return;
        }
        const cfg = state.settings || getDefaultSettings();
        const activeTeachers = (state.teachers || []).filter(t => t.status !== 'nonaktif');
        const t1 = activeTeachers[0]?.kode_guru || 'GR-001';
        const t2 = activeTeachers[1]?.kode_guru || t1;
        const t3 = activeTeachers[2]?.kode_guru || t1;
        const s1 = state.subjects?.[0]?.kode_mapel || 'MTK';
        const s2 = state.subjects?.[1]?.kode_mapel || s1;
        const s3 = state.subjects?.[2]?.kode_mapel || s1;
        const c1 = state.classes?.[0]?.nama_kelas || 'VII A';
        const c2 = state.classes?.[1]?.nama_kelas || c1;

        const headers = ['kode_guru', 'hari', 'kode_mapel', 'nama_kelas', 'jam_ke', 'jam_mulai', 'jam_selesai'];
        const sampleRows = [
          [t1, 'Senin', s1, c1, '1-2', '', ''],
          [t2, 'Senin', s2, c1, '3', '', ''],
          [t3, 'Jumat', s3, c2, '1-2', '07:30', '08:40']
        ];

        const wsTemplate = buildStyledExcelSheet(headers, sampleRows, {
          colWidths: [14, 13, 15, 16, 12, 14, 14],
          textCols: [0, 2, 3, 4, 5, 6],
          centerCols: [0, 1, 2, 3, 4, 5, 6],
          extraBlankRows: 20
        });

        const guideRows = [
          ['kode_guru', 'WAJIB', t1, 'Harus sesuai dengan Kode Guru aktif yang terdaftar (lihat daftar di bawah).'],
          ['hari', 'WAJIB', 'Senin / Selasa / ... / Sabtu', 'Nama hari KBM (Senin, Selasa, Rabu, Kamis, Jumat, atau Sabtu).'],
          ['kode_mapel', 'WAJIB', s1, 'Harus sesuai dengan Kode Mata Pelajaran yang terdaftar (lihat daftar di bawah).'],
          ['nama_kelas', 'WAJIB', c1, 'Harus sesuai dengan Nama Kelas yang terdaftar (lihat daftar di bawah).'],
          ['jam_ke', 'WAJIB', '1-2 atau 3', 'Isi rentang jam blok (misal 1-2) atau jam tunggal (misal 3). Sudah diformat teks agar tidak berubah menjadi tanggal.'],
          ['jam_mulai', 'Opsional', '07:30', 'Format JJ:MM. Kosongkan jika ingin memakai jam otomatis dari Template Jam Pelajaran.'],
          ['jam_selesai', 'Opsional', '08:40', 'Format JJ:MM. Kosongkan jika ingin memakai jam otomatis dari Template Jam Pelajaran.']
        ];

        const teacherRefRows = activeTeachers.map((t, i) => [String(i + 1), t.kode_guru, t.nama_lengkap, 'AKTIF']);
        const subjectRefRows = (state.subjects || []).map((s, i) => [String(i + 1), s.kode_mapel, s.nama_mapel, '']);
        const classRefRows = (state.classes || []).map((c, i) => [String(i + 1), c.nama_kelas, `Tingkat ${c.tingkat || '-'}`, '']);
        const slotRefRows = getLessonSlotsForDay('Senin').map(sl => [`Jam ke-${sl.jam_ke}`, sl.jam_mulai, sl.jam_selesai, 'Acuan Slot Jam Pelajaran']);

        const wsGuide = buildGuideAndReferenceSheet(
          `PANDUAN PENGISIAN JADWAL KBM`,
          'Isi jadwal pada Sheet "Template_Jadwal_KBM" mulai baris ke-2. Hapus atau timpa baris contoh sebelum mengunggah.',
          guideRows,
          [
            {
              title: `1. DAFTAR KODE GURU AKTIF (${teacherRefRows.length} Guru)`,
              headers: ['No.', 'Kode Guru', 'Nama Lengkap Guru', 'Status'],
              rows: teacherRefRows
            },
            {
              title: `2. DAFTAR KODE MATA PELAJARAN (${subjectRefRows.length} Mapel)`,
              headers: ['No.', 'Kode Mapel', 'Nama Mata Pelajaran', ''],
              rows: subjectRefRows
            },
            {
              title: `3. DAFTAR NAMA KELAS (${classRefRows.length} Kelas)`,
              headers: ['No.', 'Nama Kelas', 'Keterangan', ''],
              rows: classRefRows
            },
            {
              title: '4. REFERENSI SLOT JAM PELAJARAN (SENIN)',
              headers: ['Jam Ke', 'Waktu Mulai', 'Waktu Selesai', 'Keterangan'],
              rows: slotRefRows
            }
          ]
        );

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsTemplate, 'Template_Jadwal_KBM');
        XLSX.utils.book_append_sheet(wb, wsGuide, 'Petunjuk_&_Referensi');
        XLSX.writeFile(wb, 'Template_Jadwal_KBM_Guru.xlsx');
        showToast('Template Excel Jadwal KBM berhasil diunduh.', 'success');
      };

      document.getElementById('input-sch-excel-file').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const wb = XLSX.read(evt.target.result, { type: 'binary' });
            const rawAll = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            const raw = rawAll.filter(r => Object.values(r).some(v => String(v ?? '').trim() !== ''));
            const preview = document.getElementById('sch-import-preview-area');

            if (raw.length === 0) {
              preview.innerHTML = `<p class="text-xs text-rose-600 font-bold">File Excel kosong atau belum ada baris jadwal yang diisi.</p>`;
              return;
            }

            const firstKeys = Object.keys(normalizeExcelRowKeys(raw[0]));
            if (!firstKeys.includes('kode_guru') || !firstKeys.includes('hari') || !firstKeys.includes('kode_mapel') || !firstKeys.includes('nama_kelas')) {
              preview.innerHTML = `<div class="p-3 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">Struktur kolom tidak sesuai! Wajib memiliki kolom: <code>kode_guru</code>, <code>hari</code>, <code>kode_mapel</code>, dan <code>nama_kelas</code>.</div>`;
              return;
            }

            const VALID_DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

            parsedSchedules = raw.map((rawRow, idx) => {
              const r = normalizeExcelRowKeys(rawRow);
              const kodeGuru = String(r.kode_guru || '').trim().toUpperCase();
              const rawHari = String(r.hari || '').trim();
              const hari = VALID_DAYS.find(d => d.toLowerCase() === rawHari.toLowerCase()) || rawHari;
              const kodeMapel = String(r.kode_mapel || '').trim().toUpperCase();
              const namaKelas = String(r.nama_kelas || '').trim();

              const rawJamKe = String(r.jam_ke ?? '1').trim();
              let startJam = 1;
              let endJam = 1;
              if (rawJamKe.includes('-')) {
                const parts = rawJamKe.split('-').map(p => Number(p.trim())).filter(n => !isNaN(n) && n > 0);
                if (parts.length >= 2) {
                  startJam = parts[0];
                  endJam = parts[1];
                } else if (parts.length === 1) {
                  startJam = endJam = parts[0];
                }
              } else if (!isNaN(Number(rawJamKe)) && Number(rawJamKe) > 0) {
                startJam = endJam = Number(rawJamKe);
              }
              if (endJam < startJam) {
                const temp = startJam;
                startJam = endJam;
                endJam = temp;
              }

              const daySlots = getLessonSlotsForDay(hari);
              const slotStart = daySlots.find(sl => sl.jam_ke === startJam);
              const slotEnd = daySlots.find(sl => sl.jam_ke === endJam);

              let jamMulai = parseExcelTimeValue(r.jam_mulai);
              let jamSelesai = parseExcelTimeValue(r.jam_selesai);

              if (!jamMulai && slotStart) jamMulai = slotStart.jam_mulai;
              if (!jamSelesai && slotEnd) jamSelesai = slotEnd.jam_selesai;

              const tch = state.teachers.find(t => t.kode_guru.toUpperCase() === kodeGuru);
              const sub = state.subjects.find(s => s.kode_mapel.toUpperCase() === kodeMapel);
              const cls = state.classes.find(c => c.nama_kelas.toLowerCase() === namaKelas.toLowerCase());

              let error = '';
              if (!tch) error = `Kode guru "${kodeGuru}" tidak ditemukan`;
              else if (!VALID_DAYS.includes(hari)) error = `Hari "${rawHari}" tidak valid`;
              else if (!sub) error = `Kode mapel "${kodeMapel}" tidak ditemukan`;
              else if (!cls) error = `Kelas "${namaKelas}" tidak ditemukan`;
              else if (!jamMulai || !jamSelesai) error = `Waktu jam ke ${formatJamKeDisplay(startJam, endJam)} tidak ditemukan di template hari ${hari}`;
              else {
                const cErr = checkScheduleConflict({
                  teacher_id: tch.id,
                  class_id: cls?.id || null,
                  school_year_id: activeYear?.id || '',
                  hari,
                  jam_mulai: jamMulai,
                  jam_selesai: jamSelesai,
                  kategori: 'KBM_REGULER'
                });
                if (cErr) error = cErr;
              }

              return {
                rowNum: idx + 2,
                tch,
                sub,
                cls,
                kategori: 'KBM_REGULER',
                nama_tugas: sub?.nama_mapel || 'KBM',
                lokasi: cls?.nama_kelas || '',
                hari,
                jamKe: startJam,
                jamKeSelesai: endJam,
                jamMulai,
                jamSelesai,
                valid: !error,
                error
              };
            });

            const validCount = parsedSchedules.filter(x => x.valid).length;
            preview.innerHTML = `
              <div class="max-h-52 overflow-auto border border-[#E2E8F0] rounded-2xl">
                <table class="w-full text-left text-xs min-w-[560px]">
                  <thead class="bg-[#F8FAFC] text-[11px] font-bold text-[#94A3B8] whitespace-nowrap">
                    <tr><th class="p-2.5">Baris</th><th class="p-2.5">Guru</th><th class="p-2.5">Mata Pelajaran</th><th class="p-2.5">Kelas</th><th class="p-2.5">Hari &amp; Jam</th><th class="p-2.5">Status</th></tr>
                  </thead>
                  <tbody class="divide-y divide-[#E2E8F0]">
                    ${parsedSchedules.map(p => `
                      <tr>
                        <td class="p-2.5">${p.rowNum}</td>
                        <td class="p-2.5 font-bold">${escapeHtml(p.tch?.nama_lengkap || '-')}</td>
                        <td class="p-2.5">${escapeHtml(p.sub?.nama_mapel || '-')}</td>
                        <td class="p-2.5">${escapeHtml(p.cls?.nama_kelas || '-')}</td>
                        <td class="p-2.5">${p.hari} (Jam ${formatJamKeDisplay(p.jamKe, p.jamKeSelesai)}, ${p.jamMulai}–${p.jamSelesai})</td>
                        <td class="p-2.5">${p.valid ? '<span class="text-emerald-600 font-bold">Valid</span>' : `<span class="text-rose-600 font-bold">${escapeHtml(p.error)}</span>`}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              <div class="flex justify-end gap-2 pt-2 border-t border-[#E2E8F0]">
                <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-[#F8FAFC] hover:bg-[#F1F5F9] text-xs font-bold text-[#475569] transition">Batal</button>
                <button id="btn-confirm-sch-import" ${validCount === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#2563EB] hover:bg-[#1D4ED8] disabled:bg-[#D5D7E8] text-white text-xs font-bold transition shadow-sm">
                  Impor ${validCount} Jadwal Valid
                </button>
              </div>
            `;

            const btn = document.getElementById('btn-confirm-sch-import');
            if (btn) {
              btn.onclick = async () => {
                for (const item of parsedSchedules.filter(x => x.valid)) {
                  await dbAdapter.addDocument('teaching_schedules', {
                    teacher_id: item.tch.id,
                    kategori: 'KBM_REGULER',
                    nama_tugas: item.nama_tugas || '',
                    lokasi: item.lokasi || '',
                    subject_id: item.sub?.id || '',
                    class_id: item.cls?.id || '',
                    school_year_id: activeYear?.id || '',
                    hari: item.hari,
                    jam_ke: item.jamKe,
                    jam_ke_selesai: item.jamKeSelesai,
                    jam_mulai: item.jamMulai,
                    jam_selesai: item.jamSelesai
                  });
                }
                closeModal();
                showToast(`${validCount} jadwal KBM berhasil diimpor.`, 'success');
                renderAdminTabContent();
              };
            }
          } catch (err) {
            showToast('Gagal membaca file Excel: ' + err.message, 'error');
          }
        };
        reader.readAsBinaryString(file);
      };
    }

    // -------------------------------------------------------------------------
    // MODUL 7: MANAJEMEN QR CODE (TABEL MINIMALIS MODERN SESUAI APLIKASI RAPOR)
    // -------------------------------------------------------------------------
    function renderQrCodesModule(container) {
      const pageSize = Number(state.qrPageSize) || 10;
      let currentPage = Number(state.qrPage) || 1;

      function getFilteredTeachers() {
        const q = (state.qrSearch || state.searchGlobal || '').trim().toLowerCase();
        return state.teachers.filter(t => {
          if (!q) return true;
          const tok = state.qrTokens.find(qr => qr.teacher_id === t.id && qr.is_active) || state.qrTokens.find(qr => qr.teacher_id === t.id);
          return (t.nama_lengkap || '').toLowerCase().includes(q) ||
            (t.kode_guru || '').toLowerCase().includes(q) ||
            (tok?.token || '').toLowerCase().includes(q);
        });
      }

      function updateTableContent() {
        const filtered = getFilteredTeachers();
        const totalFiltered = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalFiltered / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        state.qrPage = currentPage;

        const startIdx = (currentPage - 1) * pageSize;
        const endIdx = Math.min(startIdx + pageSize, totalFiltered);
        const pageItems = filtered.slice(startIdx, endIdx);

        const tbody = document.getElementById('qr-table-body');
        if (tbody) {
          if (pageItems.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="5" class="py-12 text-center text-xs sm:text-sm text-[#94A3B8]">
                  Tidak ada data token QR yang sesuai.
                </td>
              </tr>
            `;
          } else {
            tbody.innerHTML = pageItems.map((t, idx) => {
              const rowNo = startIdx + idx + 1;
              const tok = state.qrTokens.find(q => q.teacher_id === t.id && q.is_active) || state.qrTokens.find(q => q.teacher_id === t.id);
              const isAktif = Boolean(tok?.is_active);
              return `
                <tr class="hover:bg-[#F8FAFC]/70 transition">
                  <td class="py-3 px-3 sm:px-4 text-center text-[#475569] font-medium">${rowNo}</td>
                  <td class="py-3 px-3 sm:px-4">
                    <p class="font-semibold text-[#0F172A]">${escapeHtml(t.nama_lengkap)}</p>
                  </td>
                  <td class="py-3 px-3 sm:px-4 font-mono font-bold text-[#2563EB] text-xs sm:text-sm whitespace-nowrap">
                    ${escapeHtml(tok ? tok.token : 'Belum Ada Token')}
                  </td>
                  <td class="py-3 px-3 sm:px-4 font-semibold text-[#0F172A] whitespace-nowrap">
                    ${isAktif ? 'AKTIF' : 'NONAKTIF'}
                  </td>
                  <td class="py-3 px-3 sm:px-4 text-center whitespace-nowrap">
                    <div class="inline-flex items-center justify-center gap-1.5">
                      <button data-qr-card="${t.id}" data-tooltip="Lihat & Cetak Kartu QR" class="btn-qr-show-card w-8 h-8 rounded-lg bg-[#059669] hover:bg-[#047857] text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                      </button>
                      ${tok ? `
                        <button data-toggle-tok="${tok.id}" data-tooltip="${tok.is_active ? 'Nonaktifkan Token QR' : 'Aktifkan Token QR'}" class="btn-qr-toggle w-8 h-8 rounded-lg ${tok.is_active ? 'bg-[#DC2626] hover:bg-[#B91C1C]' : 'bg-[#059669] hover:bg-[#047857]'} text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                          <i data-lucide="power" class="w-4 h-4"></i>
                        </button>
                      ` : ''}
                      <button data-regen-tid="${t.id}" data-tooltip="Buat Ulang Token QR" class="btn-qr-regen w-8 h-8 rounded-lg bg-[#D97706] hover:bg-[#B45309] text-white inline-flex items-center justify-center shadow-xs active:scale-90 transition">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }

        const infoEl = document.getElementById('qr-pagination-info');
        if (infoEl) {
          infoEl.textContent = totalFiltered === 0 ? 'Menampilkan 0 data' : `Menampilkan ${startIdx + 1} - ${endIdx} dari ${totalFiltered} data`;
        }

        const navEl = document.getElementById('qr-pagination-nav');
        if (navEl) {
          let pagesHtml = '';
          for (let p = 1; p <= totalPages; p++) {
            if (p === currentPage) {
              pagesHtml += `<button class="w-8 h-8 rounded-lg bg-[#2563EB] text-white text-xs font-bold shadow-sm flex items-center justify-center">${p}</button>`;
            } else {
              pagesHtml += `<button data-goto-page="${p}" class="btn-goto-page w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white hover:bg-[#F8FAFC] text-[#475569] text-xs font-semibold flex items-center justify-center transition">${p}</button>`;
            }
          }
          navEl.innerHTML = `
            <button id="btn-qr-prev" ${currentPage <= 1 ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white text-[#475569] hover:bg-[#F8FAFC] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition font-semibold text-xs">&laquo;</button>
            ${pagesHtml}
            <button id="btn-qr-next" ${currentPage >= totalPages ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-[#CBD5E1] bg-white text-[#475569] hover:bg-[#F8FAFC] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition font-semibold text-xs">&raquo;</button>
          `;

          const prevBtn = document.getElementById('btn-qr-prev');
          if (prevBtn) prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; state.qrPage = currentPage; updateTableContent(); } };
          const nextBtn = document.getElementById('btn-qr-next');
          if (nextBtn) nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; state.qrPage = currentPage; updateTableContent(); } };
          navEl.querySelectorAll('.btn-goto-page').forEach(b => {
            b.onclick = () => {
              currentPage = Number(b.dataset.gotoPage);
              state.qrPage = currentPage;
              updateTableContent();
            };
          });
        }

        const tbodyEl = document.getElementById('qr-table-body');
        if (tbodyEl) {
          tbodyEl.querySelectorAll('.btn-qr-show-card').forEach(b => {
            b.onclick = () => openSingleQrCardModal(state.teachers.find(x => x.id === b.dataset.qrCard));
          });

          tbodyEl.querySelectorAll('.btn-qr-toggle').forEach(b => {
            b.onclick = async () => {
              const tok = state.qrTokens.find(q => q.id === b.dataset.toggleTok);
              if (!tok) return;
              const nextState = !tok.is_active;
              await dbAdapter.setDocument('qr_tokens', tok.id, { ...tok, is_active: nextState });
              await recordAuditLog({
                aksi: nextState ? 'ACTIVATE_QR_TOKEN' : 'DEACTIVATE_QR_TOKEN',
                entitas: 'qr_tokens',
                target_id: tok.token,
                detail_perubahan: `Mengubah status token QR menjadi ${nextState ? 'Aktif' : 'Nonaktif'}`
              });
              showToast(`Token QR berhasil di-${nextState ? 'aktifkan' : 'nonaktifkan'}.`, 'success');
              renderAdminTabContent();
            };
          });

          tbodyEl.querySelectorAll('.btn-qr-regen').forEach(b => {
            b.onclick = () => {
              const t = state.teachers.find(x => x.id === b.dataset.regenTid);
              confirmDialog({
                title: 'Buat Ulang Token QR Code',

    function formatHariTanggalIndo(hari, tanggalStr) {
      if (!tanggalStr) return '-';
      const parts = tanggalStr.split('-');
      if (parts.length === 3) {
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);
        // Hitung nama hari kalender nyata agar tidak pernah tertukar atau keliru
        const dt = new Date(y, m - 1, d);
        const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const realHari = HARI[dt.getDay()];
        const yy = parts[0].slice(-2);
        return `${realHari}, ${parts[2]}-${parts[1]}-${yy}`;
      }
      return tanggalStr;
    }

      // Ambil seluruh rekaman kehadiran nyata dari state.attendanceRecords (Murni Riwayat Nyata)

        const katInfo = getKategoriInfo(kat);

        // Bersihkan nama mapel dari nama kelas agar tidak meluber ke bawah
        let mapelName = sub ? sub.nama_mapel : (rec.nama_tugas || sched?.nama_tugas || katInfo.label);
        mapelName = mapelName.replace(/\s*\(.*?\)\s*/g, '').trim();

        const lokasi = rec.lokasi || sched?.lokasi || (cls ? cls.nama_kelas : '-');

        return {
          recordId: rec.id,
          teacher: t || { id: rec.teacher_id, nama_lengkap: 'Guru Terhapus', kode_guru: '-' },
          schedule: sched || null,

          hari: rec.hari,

          catatan: rec.catatan_koreksi || ''

      });

      // Terapkan filter tambahan (Fokus KBM Mengajar)
      rows = rows.filter(r => {

        // Filter Periode (Harian / Bulanan / Semua Data)

          if (state.historyFilterMonth && !r.tanggal.startsWith(state.historyFilterMonth)) return false;

    function renderCorrectionsModule(container) {
      const correctedRecords = state.attendanceRecords.filter(r => r.catatan_koreksi || r.metode === 'ADMIN_ENTRY' || r.status === 'Izin' || r.status === 'Sakit');

      let currentPage = Number(state.correctionPage) || 1;

      function getFilteredCorrections() {
        const q = (state.correctionSearch || state.searchGlobal || '').trim().toLowerCase();
        if (!q) return correctedRecords;
        return correctedRecords.filter(rec => {
          const t = state.teachers.find(x => x.id === rec.teacher_id);
          const k = getKategoriInfo(rec.kategori || 'KBM_REGULER');
          const taskName = rec.nama_tugas || k.label;
          return (t?.nama_lengkap || '').toLowerCase().includes(q) ||
            (t?.kode_guru || '').toLowerCase().includes(q) ||
            (rec.tanggal || '').includes(q) ||
            (rec.hari || '').toLowerCase().includes(q) ||
            (rec.status || '').toLowerCase().includes(q) ||
            taskName.toLowerCase().includes(q) ||
            (rec.catatan_koreksi || '').toLowerCase().includes(q);
        });
      }

        const filtered = getFilteredCorrections();
        const totalFiltered = filtered.length;

        if (currentPage > totalPages) currentPage = totalPages;
        state.correctionPage = currentPage;

        const startIdx = (currentPage - 1) * pageSize;

      function updateDutyOptions(selectedSchId = '') {
        const tid = document.getElementById('corr-teacher').value;
        const dt = document.getElementById('corr-date').value;
        const dObj = new Date(`${dt}T08:00:00+07:00`);
        const wibDayIdx = new Date(dObj.getTime() + 7 * 3600 * 1000).getUTCDay();
        const hariName = HARI_LIST[wibDayIdx];
        const duties = getTodaySchedulesForTeacher(tid, hariName);
        const selDuty = document.getElementById('corr-schedule');

        if (duties.length === 0) {
          selDuty.innerHTML = `<option value="">Tidak ada jadwal KBM (${hariName}) - Absensi Harian Umum</option>`;
        } else {
          selDuty.innerHTML = duties.map(d => {
            const sub = state.subjects.find(s => s.id === d.subject_id);
            const cls = state.classes.find(c => c.id === d.class_id);
            const title = sub ? sub.nama_mapel : (d.nama_tugas || 'KBM');
            const loc = cls ? cls.nama_kelas : (d.lokasi || '-');
            const isSel = selectedSchId ? d.id === selectedSchId : false;
            return `<option value="${d.id}" ${isSel ? 'selected' : ''}>${title} (${d.jam_mulai}–${d.jam_selesai} • ${loc})</option>`;
          }).join('');
        }
        initCustomSelects(selDuty.closest('.custom-select-wrapper')?.parentNode || selDuty.parentNode);
      }

      updateDutyOptions(scheduleId);

      document.getElementById('corr-teacher').onchange = () => updateDutyOptions();
      document.getElementById('corr-date').onchange = () => updateDutyOptions();

      document.getElementById('form-correction').onsubmit = async (e) => {
        e.preventDefault();
        const tid = document.getElementById('corr-teacher').value;
        const dt = document.getElementById('corr-date').value;
        const newStatus = document.getElementById('corr-status').value;
        const targetSchId = document.getElementById('corr-schedule').value;
        const reason = document.getElementById('corr-reason').value.trim();

        if (reason.length < 4) {
          showToast('Alasan perubahan wajib diisi dengan jelas.', 'warning');
          return;
        }

        const dObj = new Date(`${dt}T08:00:00+07:00`);
        const wibDayIdx = new Date(dObj.getTime() + 7 * 3600 * 1000).getUTCDay();
        const hariName = HARI_LIST[wibDayIdx];

        const targetSched = state.schedules.find(s => s.id === targetSchId) || getFirstScheduleForTeacherOnDay(tid, hariName);
        const recId = targetSched ? `${tid}_${targetSched.id}_${dt}` : `${tid}_${dt}`;
        const existing = state.attendanceRecords.find(r => r.id === recId || (r.teacher_id === tid && r.schedule_id === targetSched?.id && r.tanggal === dt));
        const oldStatus = existing ? existing.status : 'Belum Tercatat';

        const sub = targetSched ? state.subjects.find(s => s.id === targetSched.subject_id) : null;
        const cls = targetSched ? state.classes.find(c => c.id === targetSched.class_id) : null;
        const kat = targetSched?.kategori || 'KBM_REGULER';
        const katInfo = getKategoriInfo(kat);
        const taskName = targetSched?.nama_tugas || (sub ? sub.nama_mapel : katInfo.label);
        const taskLoc = targetSched?.lokasi || (cls ? cls.nama_kelas : '-');

        const payload = {
          teacher_id: tid,
          schedule_id: targetSched?.id || '',
          kategori: kat,
          nama_tugas: taskName,
          lokasi: taskLoc,
          tanggal: dt,
          hari: hariName,
          jadwal_jam_mulai: existing?.jadwal_jam_mulai || targetSched?.jam_mulai || '-',
          jadwal_jam_selesai: existing?.jadwal_jam_selesai || targetSched?.jam_selesai || '-',
          subject_id: existing?.subject_id || targetSched?.subject_id || '',
          class_id: existing?.class_id || targetSched?.class_id || '',
          waktu_absensi: existing?.waktu_absensi || getJakartaNow().timeFull,
          status: newStatus,
          metode: 'ADMIN_ENTRY',
          device_info: getDeviceSummary(),
          catatan_koreksi: reason
        };

        await dbAdapter.setDocument('attendance_records', recId, payload);

        const tch = state.teachers.find(t => t.id === tid);
        await recordAuditLog({
          aksi: 'ATTENDANCE_CORRECTION',
          entitas: 'attendance_records',
          target_id: recId,
          detail_perubahan: `Koreksi status [${katInfo.label} - ${taskName}] ${tch?.nama_lengkap || tid} pada ${dt}: [${oldStatus}] -> [${newStatus}]`,
          alasan: reason
        });

        closeModal();
        showToast('Koreksi absensi berhasil disimpan & dicatat di Audit Log.', 'success');
        renderAdminTabContent();
      };
    }

    // -------------------------------------------------------------------------
    // MODUL 10: PUSAT REKAPITULASI BULANAN BENDAHARA (REKAP HONOR KBM GURU)
    // -------------------------------------------------------------------------
    function buildMonthlyRecapData() {
      const monthStr = state.reportMonth || getJakartaNow().dateStr.slice(0, 7);
      const [y, m] = monthStr.split('-').map(Number);
      const monthName = BULAN_LIST[m - 1] || monthStr;

      const targetTeachers = (state.reportTeacherStatus === 'all')
        ? state.teachers
        : state.teachers.filter(t => t.status === 'aktif');

      // Ambil seluruh rekap absensi KBM pada bulan terpilih
      const monthRecords = state.attendanceRecords.filter(r => (r.tanggal || '').startsWith(monthStr) && (!r.kategori || r.kategori === 'KBM_REGULER'));

      let grandTotalHadir = 0;
      let grandTotalTerlambat = 0;
      let grandTotalIzin = 0;
      let grandTotalSakit = 0;
      let grandTotalTidakHadir = 0;

      const rows = targetTeachers.map((t, idx) => {
        const tRecs = monthRecords.filter(r => r.teacher_id === t.id);

        let hadir = 0;
        let terlambat = 0;
        let izin = 0;
        let sakit = 0;
        let tidakHadir = 0;

        tRecs.forEach(r => {
          if (r.status === 'Hadir') {
            hadir++;
          } else if (r.status === 'Terlambat') {
            terlambat++;
          } else if (r.status === 'Izin') {
            izin++;
          } else if (r.status === 'Sakit') {
            sakit++;
          } else if (r.status === 'Tidak Hadir' || r.status === 'Alpa') {
            tidakHadir++;
          }
        });

        grandTotalHadir += hadir;
        grandTotalTerlambat += terlambat;
        grandTotalIzin += izin;
        grandTotalSakit += sakit;
        grandTotalTidakHadir += tidakHadir;

        return {
          no: idx + 1,
          id: t.id,
          kode_guru: t.kode_guru,
          nama_lengkap: t.nama_lengkap,
          nip_nuptk: t.nip_nuptk || '',
          hadir,
          terlambat,
          izin,
          sakit,
          tidak_hadir: tidakHadir,
          records: tRecs
        };
      });

      return {
        monthStr,
        monthName,
        year: y,
        rows,
        totals: {
          hadir: grandTotalHadir,
          terlambat: grandTotalTerlambat,
          izin: grandTotalIzin,
          sakit: grandTotalSakit,
          tidak_hadir: grandTotalTidakHadir
        }
      };
    }

        </div>
      `;

      const logoUrlInput = document.getElementById('set-logo-url');
      const logoPreview = document.getElementById('set-logo-preview');
      const btnClearLogo = document.getElementById('btn-clear-logo');

      function updateLogoPreview(src) {
        if (src) {
          logoPreview.innerHTML = `<img src="${escapeHtml(src)}" alt="Preview Logo" class="w-full h-full object-cover p-1" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full bg-rose-50 text-rose-500 flex items-center justify-center text-[10px] font-bold text-center p-1\\'>Gagal Memuat</div>';" />`;
          if (btnClearLogo) btnClearLogo.classList.remove('hidden');
        } else {
          logoPreview.innerHTML = `<div class="w-full h-full bg-[#2563EB] flex items-center justify-center text-white font-extrabold text-base">HG</div>`;
          if (btnClearLogo) btnClearLogo.classList.add('hidden');
        }
      }

      if (logoUrlInput) {
        logoUrlInput.oninput = (e) => {
          updateLogoPreview(e.target.value.trim());
        };
      }

      if (btnClearLogo) {
        btnClearLogo.onclick = () => {
          if (logoUrlInput) logoUrlInput.value = '';
          updateLogoPreview('');
        };
      }

      const setJenisLembaga = document.getElementById('set-jenis-lembaga');
      if (setJenisLembaga) {
        setJenisLembaga.onchange = (e) => {
          const isMadrasah = e.target.value === 'madrasah';
          const title = isMadrasah ? 'Kepala Madrasah' : 'Kepala Sekolah';
          const lblNama = document.getElementById('lbl-nama-kepala');
          const lblNip = document.getElementById('lbl-nip-kepala');
          if (lblNama) lblNama.textContent = `Nama ${title}`;
          if (lblNip) lblNip.textContent = `NIP ${title} (Opsional)`;
        };
      }

      const setAppThemeSelect = document.getElementById('set-app-theme');
      if (setAppThemeSelect) {
        setAppThemeSelect.onchange = (e) => {
          setAppTheme(e.target.value);
        };
      }

      const geofenceLatitudeInput = document.getElementById('set-geofence-latitude');
      const geofenceLongitudeInput = document.getElementById('set-geofence-longitude');
      const geofenceStatus = document.getElementById('geofence-location-status');
      const useCurrentGeofenceLocation = document.getElementById('btn-use-current-geofence-location');

      if (useCurrentGeofenceLocation) {
        useCurrentGeofenceLocation.onclick = async () => {
          const originalText = useCurrentGeofenceLocation.textContent;
          useCurrentGeofenceLocation.disabled = true;
          useCurrentGeofenceLocation.textContent = 'Mengambil lokasi...';
          try {
            const position = await requestCurrentDevicePosition();
            geofenceLatitudeInput.value = Number(position.coords.latitude).toFixed(6);
            geofenceLongitudeInput.value = Number(position.coords.longitude).toFixed(6);
            if (geofenceStatus) {
              geofenceStatus.className = 'text-[11px] font-semibold rounded-xl px-3 py-2 bg-emerald-50 text-emerald-700';
              geofenceStatus.textContent = `Koordinat berhasil diambil (akurasi ±${Math.round(position.coords.accuracy)} m). Periksa kembali sebelum menyimpan.`;
            }
          } catch (err) {
            if (geofenceStatus) {
              geofenceStatus.className = 'text-[11px] font-semibold rounded-xl px-3 py-2 bg-rose-50 text-rose-700';
              geofenceStatus.textContent = err.message;
            }
          } finally {
            useCurrentGeofenceLocation.disabled = false;
            useCurrentGeofenceLocation.textContent = originalText;
          }
        };
      }

      document.getElementById('form-app-settings').onsubmit = async (e) => {
        e.preventDefault();
        const hari_kerja = Array.from(document.querySelectorAll('input[name="hari_kerja"]:checked')).map(el => el.value);
        const mode_toleransi = document.getElementById('set-mode-toleransi').value;
        const app_theme = document.getElementById('set-app-theme') ? document.getElementById('set-app-theme').value : getAppTheme();
        const geofence_enabled = document.getElementById('set-geofence-enabled').checked;
        const geofence_latitude = document.getElementById('set-geofence-latitude').value.trim();
        const geofence_longitude = document.getElementById('set-geofence-longitude').value.trim();
        const geofence_radius_meters = Number(document.getElementById('set-geofence-radius').value);

        if (geofence_enabled && !isValidCoordinate(
          geofence_latitude === '' ? NaN : Number(geofence_latitude),
          geofence_longitude === '' ? NaN : Number(geofence_longitude)
        )) {
          showToast('Latitude dan longitude kantor harus diisi dengan koordinat yang valid sebelum pembatasan GPS diaktifkan.', 'error');
          return;
        }
        if (!Number.isFinite(geofence_radius_meters) || geofence_radius_meters < 10 || geofence_radius_meters > 500) {
          showToast('Radius absensi harus berada antara 10 sampai 500 meter.', 'error');
          return;
        }

        const updated = {
          ...cfg,
          nama_instansi: document.getElementById('set-nama-instansi').value.trim(),
          logo_url: document.getElementById('set-logo-url').value.trim(),
          app_theme,
          geofence_enabled,
          geofence_latitude,
          geofence_longitude,
          geofence_radius_meters,
          jenis_lembaga: document.getElementById('set-jenis-lembaga') ? document.getElementById('set-jenis-lembaga').value : 'madrasah',
          kop_baris1: document.getElementById('set-kop-baris1') ? document.getElementById('set-kop-baris1').value.trim() : '',
          kop_baris2: document.getElementById('set-kop-baris2') ? document.getElementById('set-kop-baris2').value.trim() : '',
          kop_baris3: document.getElementById('set-kop-baris3') ? document.getElementById('set-kop-baris3').value.trim() : '',
          kop_baris4: document.getElementById('set-kop-baris4') ? document.getElementById('set-kop-baris4').value.trim() : '',
          nama_kepala_sekolah: document.getElementById('set-nama-kepala') ? document.getElementById('set-nama-kepala').value.trim() : '',
          nip_kepala_sekolah: document.getElementById('set-nip-kepala') ? document.getElementById('set-nip-kepala').value.trim() : '',
          mode_toleransi,
          menit_buka_sebelum_jadwal: Number(document.getElementById('set-buka-menit').value),
          toleransi_terlambat_menit: Number(document.getElementById('set-toleransi-menit').value),
          batas_akhir_menit_setelah_jadwal: Number(document.getElementById('set-batas-menit').value),
          kebijakan_lewat_batas: document.getElementById('set-kebijakan').value,
          jeda_reset_publik_detik: Number(document.getElementById('set-reset-detik').value),
          hari_kerja
        };
        await dbAdapter.setDocument('attendance_settings', 'global_config', updated);
        state.settings = updated;
        await recordAuditLog({
          aksi: 'UPDATE_SETTINGS',
          entitas: 'attendance_settings',
          target_id: 'global_config',
          detail_perubahan: `Memperbarui nama instansi (${updated.nama_instansi}) dan pengaturan aplikasi`
        });
        showToast('Pengaturan aplikasi berhasil disimpan.', 'success');
        renderAdminLayout();
        renderAdminTabContent();
      };

      if (IS_PREVIEW) {
        const btnReset = document.getElementById('btn-reset-demo-db');
        if (btnReset) {
          btnReset.onclick = () => {
            confirmDialog({
              title: 'Reset Data Preview',
              message: 'Seluruh data simulasi akan dikembalikan ke kondisi awal bawaan. Lanjutkan?',
              onConfirm: async () => {
                localStorage.removeItem(PREVIEW_STORAGE_KEY);
                await dbAdapter.getAll();
                showToast('Database simulasi berhasil direset.', 'success');
                renderAdminTabContent();
              }
            });
          };
        }
      }
    }

                    <th class="py-3 px-3 sm:px-4">Detail Perubahan</th>
                    <th class="py-3 px-3 sm:px-4 w-36">Alasan</th>
                    <th class="py-3 px-3 sm:px-4 text-center rounded-r-xl w-32">Perangkat</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#F1F5F9] text-xs sm:text-sm text-[#0F172A]">
                  ${state.auditLogs.length === 0
                    ? `<tr><td colspan="7">${renderEmptyState({
                        icon: 'shield-alert',
                        title: 'Belum Ada Log Audit',
                        description: 'Seluruh riwayat aksi admin, perubahan data, dan absensi guru akan dicatat otomatis di sini.'
                      })}</td></tr>`
                    : state.auditLogs.map((log, idx) => `
                    <tr class="hover:bg-[#F8FAFC]/70 transition">
                      <td class="py-3 px-3 sm:px-4 text-center text-[#475569] font-medium">${idx + 1}</td>
                      <td class="py-3 px-3 sm:px-4 font-semibold text-[#0F172A] tabular-nums whitespace-nowrap">${escapeHtml(log.waktu_wib || log.timestamp)}</td>
                      <td class="py-3 px-3 sm:px-4 font-semibold text-[#2563EB]">${escapeHtml(log.actor)}</td>
                      <td class="py-3 px-3 sm:px-4"><span class="px-2 py-0.5 rounded-lg bg-[#EFF6FF] text-[#2563EB] font-mono text-[11px] font-bold">${escapeHtml(log.aksi)}</span></td>
                      <td class="py-3 px-3 sm:px-4 text-[#0F172A]">${escapeHtml(log.detail_perubahan)}</td>
                      <td class="py-3 px-3 sm:px-4 text-[#475569]">${escapeHtml(log.alasan || '-')}</td>
                      <td class="py-3 px-3 sm:px-4 text-center text-[11px] text-[#94A3B8] whitespace-nowrap">${escapeHtml(log.device_info || '-')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. REAL-TIME LIVE CLOCK TICKER & INITIALIZATION
    // =========================================================================
    setInterval(() => {
      const jakarta = getJakartaNow();
      const pubClock = document.getElementById('public-live-clock');
      if (pubClock) pubClock.textContent = jakarta.timeFull;

      const admClock = document.getElementById('admin-live-clock');
      if (admClock) admClock.textContent = `${jakarta.formattedDate} • ${jakarta.timeFull} WIB`;
    }, 1000);

    // Global Smooth Micro-Tooltip Manager (Ultra-smooth CSS transitions, zero clipping)
    function initGlobalTooltip() {
      const tip = document.getElementById('app-tooltip');
      if (!tip) return;
      let activeEl = null;

      const showTip = (el) => {
        const text = el.getAttribute('data-tooltip') || el.dataset.tooltip;
        if (!text) return;
        activeEl = el;
        tip.textContent = text;
        tip.style.display = 'block';

        const rect = el.getBoundingClientRect();
        const tipWidth = tip.offsetWidth;
        const tipHeight = tip.offsetHeight;
        const pos = el.getAttribute('data-tooltip-pos') || 'top';

        let top, left;

        if (pos === 'right') {
          top = rect.top + (rect.height / 2) - (tipHeight / 2);
          left = rect.right + 10;
        } else {
          top = rect.top - tipHeight - 6;
          left = rect.left + (rect.width / 2) - (tipWidth / 2);

          // If too close to viewport top, show below element
          if (top < 8) {
            top = rect.bottom + 6;
          }

          // Clamp inside horizontal viewport bounds
          left = Math.max(8, Math.min(left, window.innerWidth - tipWidth - 8));
        }

        // Clamp inside vertical viewport bounds
        top = Math.max(8, Math.min(top, window.innerHeight - tipHeight - 8));

        tip.style.top = `${top}px`;
        tip.style.left = `${left}px`;

        requestAnimationFrame(() => {
          if (activeEl === el) {
            tip.classList.remove('opacity-0', 'scale-95', 'translate-y-1');
            tip.classList.add('opacity-100', 'scale-100', 'translate-y-0');
          }
        });
      };

      const hideTip = () => {
        activeEl = null;
        tip.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        tip.classList.add('opacity-0', 'scale-95', 'translate-y-1');
      };

      document.addEventListener('mouseover', (e) => {
        const target = e.target.closest ? e.target.closest('[data-tooltip]') : null;
        if (target && target !== activeEl) {
          showTip(target);
        }
      });

      document.addEventListener('mouseout', (e) => {
        const target = e.target.closest ? e.target.closest('[data-tooltip]') : null;
        if (target && target === activeEl) {
          if (!target.contains(e.relatedTarget)) {
            hideTip();
          }
        }
      });

      window.addEventListener('scroll', hideTip, true);
      document.addEventListener('click', hideTip);
    }

    async function bootstrapApp() {
      try {
        initGlobalTooltip();
        await dbAdapter.getAll();
        setAppTheme(getAppTheme());

        if (!IS_PREVIEW && fbAuth) {
          onAuthStateChanged(fbAuth, async (user) => {
            if (user) {
              try {
                state.adminUser = { uid: user.uid, email: user.email };
                await dbAdapter.getAll({ includeAdminData: true });
                await dbAdapter.syncPublicTeacherIndex();
                state.authReady = true;

                const parsedLocation = parseAppLocation();
                const requestedAdminTab = state.pendingAdminTab || (
                  parsedLocation.route === 'admin' ? parsedLocation.adminTab : null
                );
                if (requestedAdminTab) {
                  state.route = 'admin';
                  state.adminTab = normalizeAdminTab(requestedAdminTab);
                  updateAppHistory('admin', { adminTab: state.adminTab, replace: true });
                  renderAdminLayout();
                }
              } catch (err) {
                console.error('Admin session initialization error:', err);
                state.adminUser = null;
                state.authReady = true;
                await signOut(fbAuth).catch(() => {});
                if (state.route === 'admin' || parseAppLocation().route === 'admin') {
                  state.route = 'login';
                  updateAppHistory('login', { replace: true });
                  renderLoginScreen();
                }
              }
            } else {
              state.adminUser = null;
              state.authReady = true;
              if (parseAppLocation().route === 'admin' || state.route === 'admin') {
                state.route = 'login';
                updateAppHistory('login', { replace: true });
                renderLoginScreen();
              }
            }
          });
        }

        restoreRouteFromLocation();
        window.setTimeout(showInstallPromptIfAvailable, 1400);
      } catch (err) {
        console.error('Bootstrap error:', err);
        document.getElementById('app-root').innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md bg-white rounded-3xl p-6 shadow-sm text-center">
              <h2 class="text-lg font-extrabold text-rose-600 mb-2">Gagal Menghubungkan Database</h2>
              <p class="text-xs text-[#475569] leading-relaxed">${escapeHtml(err.message)}</p>
            </div>
          </div>
        `;
      }
    }

    bootstrapApp();
  </script>
</body>
